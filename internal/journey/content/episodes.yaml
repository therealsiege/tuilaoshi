# Dialogue episodes, unlocked as the pilgrimage reaches their stage and read
# in the reader (t). Lines are graded Chinese (HSK2-3) with English.
# source: "original" for episodes written for this app; novel adaptations
# cite their chapter, and mark lines quoted verbatim from the public-domain
# novel (Wikisource text, converted to simplified) with original: true. Speakers must be companions, demons, or in cast.
cast: [旁白, 老者, 太宗, 观音菩萨, 小白龙, 高老太公, 黑熊精, 镇元大仙, 清风, 车迟国王, 虎力大仙, 女王, 假悟空, 铁扇公主]

episodes:
  - id: dragon-horse
    stage: 9
    title: 鹰愁涧 The Dragon at Eagle Grief Stream
    source: original
    lines:
      - {speaker: 唐僧, zh: 悟空，我的马呢？刚才还在河边喝水。, en: "Wukong, where's my horse? It was just drinking by the river."}
      - {speaker: 孙悟空, zh: 师父，水里有一条白龙，他把马吃了！, en: "Master, there's a white dragon in the water. He ate the horse!"}
      - {speaker: 唐僧, zh: 没有马，我们怎么去西天？, en: "Without a horse, how will we get to the West?"}
      - {speaker: 孙悟空, zh: 别着急，俺老孙去打他！, en: "Don't worry. Old Sun will go and beat him!"}
      - {speaker: 观音菩萨, zh: 悟空，住手。这条龙也要去西天。, en: "Wukong, stop. This dragon is going west too."}
      - {speaker: 小白龙, zh: 对不起，我不知道那是师父的马。, en: "I'm sorry. I didn't know that was the master's horse."}
      - {speaker: 观音菩萨, zh: 你就变成一匹白马，帮唐僧走路吧。, en: "Then turn into a white horse and carry Tang Sanzang."}
      - {speaker: 唐僧, zh: 太好了！我们又有马了。, en: "Wonderful! We have a horse again."}
  - id: stolen-robe
    stage: 11
    title: 黑风山 The Stolen Robe
    source: original
    lines:
      - {speaker: 唐僧, zh: 悟空，我的袈裟不见了！那是佛祖送给我的。, en: "Wukong, my robe is gone! The Buddha gave it to me."}
      - {speaker: 孙悟空, zh: 昨天晚上着火的时候，有人偷走了它。, en: "Someone stole it last night, during the fire."}
      - {speaker: 唐僧, zh: 是谁这么坏？, en: "Who would do such a thing?"}
      - {speaker: 孙悟空, zh: 我看见一个黑影往黑风山跑了。, en: "I saw a dark shape run toward Black Wind Mountain."}
      - {speaker: 黑熊精, zh: 这件袈裟真漂亮，我要请朋友们来看看。, en: "What a beautiful robe. I'll invite my friends to come and see it."}
      - {speaker: 孙悟空, zh: 黑熊，快把袈裟还给我师父！, en: "Bear, give my master's robe back, now!"}
      - {speaker: 黑熊精, zh: 你有本事，就自己来拿吧！, en: "If you're so good, come and take it yourself!"}
  - id: gao-village
    stage: 12
    title: 高老庄 Zhu Bajie at Gao Village
    source: original
    lines:
      - {speaker: 高老太公, zh: 师父，请帮帮我们！一个妖怪住在我家，不肯走。, en: "Master, please help us! A demon lives in my house and won't leave."}
      - {speaker: 唐僧, zh: 他是什么样的妖怪？, en: "What kind of demon is he?"}
      - {speaker: 高老太公, zh: 他的耳朵很大，嘴很长，吃饭吃得特别多。, en: "He has huge ears and a long snout, and he eats enormous amounts."}
      - {speaker: 孙悟空, zh: 哈哈，一定是一只猪！今天晚上我去看看。, en: "Ha! It must be a pig. I'll go and have a look tonight."}
      - {speaker: 猪八戒, zh: 谁在我的房间里？快出来！, en: "Who's in my room? Come out!"}
      - {speaker: 孙悟空, zh: 俺老孙在这儿！你为什么不走？, en: "Old Sun is right here! Why won't you leave?"}
      - {speaker: 猪八戒, zh: 你是孙悟空？观音菩萨让我等唐僧，我等了很久了！, en: "You're Sun Wukong? Guanyin told me to wait for Tang Sanzang. I've been waiting a long time!"}
      - {speaker: 唐僧, zh: 原来是这样。那你跟我们一起去西天吧。, en: "So that's how it is. Then come west with us."}
      - {speaker: 猪八戒, zh: 好啊，师父！路上有好吃的吗？, en: "Sure, Master! Is there good food on the way?"}
  - id: yellow-wind
    stage: 13
    title: 黄风岭 The Yellow Wind
    source: original
    lines:
      - {speaker: 猪八戒, zh: 好大的风！我的眼睛都睁不开了。, en: "What a wind! I can't even open my eyes."}
      - {speaker: 孙悟空, zh: 这不是一般的风，是黄风怪吹的。, en: "That's no ordinary wind. The Yellow Wind Demon is blowing it."}
      - {speaker: 唐僧, zh: 风停了……咦，我怎么在一个山洞里？, en: "The wind has stopped... Huh, how did I end up in a cave?"}
      - {speaker: 黄风怪, zh: 抓到唐僧了！今天晚上就吃他。, en: "We've caught Tang Sanzang! We'll eat him tonight."}
      - {speaker: 孙悟空, zh: 我的眼睛被风吹得很疼，看不清楚。, en: "The wind has hurt my eyes. I can't see clearly."}
      - {speaker: 猪八戒, zh: 大师兄，我们去找人帮忙吧！, en: "Big brother, let's go and find someone to help!"}
  - id: sha-wujing
    stage: 16
    title: 流沙河 Sha Wujing Joins
    source: original
    lines:
      - {speaker: 猪八戒, zh: 这条河这么宽，水这么急，我们怎么过去？, en: "This river is so wide and so fast. How do we get across?"}
      - {speaker: 孙悟空, zh: 我可以飞过去，可是师父不能飞。, en: "I can fly over, but Master can't fly."}
      - {speaker: 沙悟净, zh: 谁敢来流沙河？, en: "Who dares come to the Flowing Sands River?"}
      - {speaker: 唐僧, zh: 我是从东土大唐来的和尚，要去西天取经。, en: "I am a monk from the Great Tang in the East, going west to fetch the scriptures."}
      - {speaker: 沙悟净, zh: 您就是唐僧？我在这里等了您很多年！, en: "You're Tang Sanzang? I've been waiting for you here for many years!"}
      - {speaker: 沙悟净, zh: 师父，我帮您挑行李，我们一起走吧。, en: "Master, I'll carry the luggage for you. Let's go together."}
      - {speaker: 猪八戒, zh: 太好了，以后我不用挑行李了！, en: "Great, now I don't have to carry the luggage!"}
  - id: ginseng-fruit
    stage: 19
    title: 人参果 The Ginseng Fruit
    source: original
    lines:
      - {speaker: 清风, zh: 这是人参果，一万年才结三十个。, en: "This is ginseng fruit. The tree bears only thirty in ten thousand years."}
      - {speaker: 唐僧, zh: 它看起来像一个小孩子，我不敢吃。, en: "It looks like a little child. I don't dare eat it."}
      - {speaker: 猪八戒, zh: 师父不吃，我吃！猴哥，你去摘几个。, en: "If Master won't eat it, I will! Monkey brother, go and pick a few."}
      - {speaker: 孙悟空, zh: 嘘，小声一点，别让他们听见。, en: "Shh, keep your voice down. Don't let them hear."}
      - {speaker: 猪八戒, zh: 我吃得太快了，还没尝到是什么味道！, en: "I ate it too fast. I didn't even taste it!"}
      - {speaker: 清风, zh: 果子少了！一定是你们偷的！, en: "Fruit is missing! It must have been you who stole it!"}
      - {speaker: 孙悟空, zh: 偷就偷了，我把这棵树也推倒！, en: "So what if we did? I'll knock the whole tree down too!"}
      - {speaker: 镇元大仙, zh: 你们弄倒了我的树，一个都别想走！, en: "You've knocked down my tree. None of you is leaving!"}
  - id: rain-contest
    stage: 35
    title: 车迟国 The Rain Contest
    source: original
    lines:
      - {speaker: 车迟国王, zh: 很久没有下雨了，谁能求来雨，我就听谁的。, en: "It hasn't rained in a long time. Whoever can bring rain, I will listen to."}
      - {speaker: 虎力大仙, zh: 我先来！我一敲令牌，雨就会下来。, en: "I'll go first! When I strike my token, the rain will come."}
      - {speaker: 孙悟空, zh: 风婆婆，雷公，你们先别动，等俺老孙说话。, en: "Old Mother Wind, Thunder Lord, hold still. Wait for old Sun's word."}
      - {speaker: 车迟国王, zh: 怎么没有风，也没有云？, en: "Why is there no wind, and no clouds?"}
      - {speaker: 唐僧, zh: 现在该我们了。悟空，看你的了。, en: "Now it's our turn. Wukong, it's up to you."}
      - {speaker: 孙悟空, zh: 下雨吧！, en: "Let it rain!"}
      - {speaker: 车迟国王, zh: 下雨了！下雨了！还是这位和尚有本事。, en: "It's raining! It's raining! This monk is the one with real skill."}
  - id: womens-kingdom
    stage: 46
    title: 西梁女国 The Women's Kingdom
    source: original
    lines:
      - {speaker: 女王, zh: 你就是从大唐来的唐僧吗？长得真好看。, en: "Are you Tang Sanzang from the Great Tang? You are very handsome."}
      - {speaker: 唐僧, zh: 陛下，我只是一个和尚，要去西天取经。, en: "Your Majesty, I am only a monk, on my way west for the scriptures."}
      - {speaker: 女王, zh: 留下来吧，做我的国王，这里什么都有。, en: "Stay. Be my king. Here you will have everything."}
      - {speaker: 猪八戒, zh: 师父不要，我可以留下来！, en: "If Master doesn't want to, I can stay!"}
      - {speaker: 孙悟空, zh: 八戒，别说话！师父，我有一个办法。, en: "Bajie, be quiet! Master, I have a plan."}
      - {speaker: 唐僧, zh: 陛下，谢谢你的好意，可是我一定要往西走。, en: "Your Majesty, thank you for your kindness, but I must keep going west."}
  - id: two-monkeys
    stage: 49
    title: 真假美猴王 The Real and Fake Monkey King
    source: original
    lines:
      - {speaker: 沙悟净, zh: 怎么有两个大师兄？, en: "How can there be two of Big Brother?"}
      - {speaker: 孙悟空, zh: 我才是真的孙悟空！, en: "I'm the real Sun Wukong!"}
      - {speaker: 假悟空, zh: 你说谎！我才是真的！, en: "You're lying! I'm the real one!"}
      - {speaker: 猪八戒, zh: 他们说的话一样，长得也一样，我看不出来。, en: "They say the same things and look the same. I can't tell them apart."}
      - {speaker: 唐僧, zh: 我念紧箍咒，谁头疼，谁就是真的。, en: "I'll recite the headband spell. Whoever gets a headache is the real one."}
      - {speaker: 猪八戒, zh: 师父，两个都在喊头疼！, en: "Master, they're both crying that their head hurts!"}
      - {speaker: 孙悟空, zh: 我们去找佛祖，佛祖一定能分清楚。, en: "Let's go to the Buddha. The Buddha can surely tell us apart."}
  - id: borrowing-the-fan
    stage: 51
    title: 芭蕉扇 Borrowing the Fan
    source: original
    lines:
      - {speaker: 孙悟空, zh: 嫂子，借你的芭蕉扇用一用，好吗？, en: "Sister-in-law, may I borrow your banana-leaf fan?"}
      - {speaker: 铁扇公主, zh: 你害了我的儿子红孩儿，还想借扇子？, en: "You harmed my son Red Boy, and now you want my fan?"}
      - {speaker: 孙悟空, zh: 红孩儿现在跟着观音菩萨，过得很好。, en: "Red Boy is with Guanyin now, and he's doing well."}
      - {speaker: 铁扇公主, zh: 我不借！你走吧！, en: "I won't lend it! Go away!"}
      - {speaker: 孙悟空, zh: 不借也可以，那我就变成小虫，飞进你的肚子里。, en: "Fine, don't. Then I'll turn into a little bug and fly into your stomach."}
      - {speaker: 铁扇公主, zh: 好疼！好疼！我借给你，快出来！, en: "It hurts! It hurts! I'll lend it to you, come out!"}
      - {speaker: 猪八戒, zh: 猴哥，这把扇子是真的吗？我看不太像。, en: "Monkey brother, is this fan real? It doesn't look quite right to me."}
  - id: novel-14
    stage: 8
    title: 第十四回 心猿归正 Wukong Freed (novel)
    source: novel, chapter 14
    lines:
      - {speaker: 旁白, zh: 唐僧来到两界山，听见山脚下有人大叫。, en: "Tang Sanzang reached Two Boundary Mountain and heard someone shouting at its foot."}
      - {speaker: 孙悟空, zh: 师父，你怎么此时才来？来得好，来得好。救我出来，我保你上西天去也。, en: "Master, why have you only come now? Good that you came, good that you came. Get me out, and I'll guard you all the way to the West.", original: true}
      - {speaker: 孙悟空, zh: 你可是东土大王差往西天取经去的么？, en: "Are you the one the king of the Eastern Land sent west for the scriptures?", original: true}
      - {speaker: 唐僧, zh: 我正是，你问怎么？, en: "I am. Why do you ask?", original: true}
      - {speaker: 孙悟空, zh: 这山顶上有我佛如来的金字压帖，你只上山去将帖儿揭起，我就出来了。, en: "On top of this mountain is the Buddha's golden-lettered seal. Just climb up and peel it off, and I'll come out.", original: true}
      - {speaker: 旁白, zh: 唐僧揭下了压帖，山一动，猴子跳了出来。, en: "Tang Sanzang peeled off the seal, the mountain shook, and the monkey leapt out."}
      - {speaker: 唐僧, zh: 我与你起个混名，称为行者，好么？, en: "I'll give you a nickname and call you Pilgrim. How's that?", original: true}
      - {speaker: 孙悟空, zh: 好，好，好。, en: "Good, good, good.", original: true}
  - id: novel-27
    stage: 20
    title: 第二十七回 尸魔三戏唐三藏 The Corpse Demon's Tricks (novel)
    source: novel, chapter 27
    lines:
      - {speaker: 唐僧, zh: 悟空，我这一日，肚中饥了，你去那里化些斋吃。, en: "Wukong, I've gone all day and I'm hungry. Go and beg some food for me to eat.", original: true}
      - {speaker: 旁白, zh: 悟空去南山摘桃子。这时候，一个年轻的女子提着饭走来了。, en: "Wukong went to the southern hill to pick peaches. Just then a young woman came along carrying food."}
      - {speaker: 猪八戒, zh: 女菩萨，往那里去？手里提著是甚么东西？, en: "Lady bodhisattva, where are you going? What's that you're carrying?", original: true}
      - {speaker: 孙悟空, zh: 师父，你面前这个女子，莫当做个好人，他是个妖精，要来骗你哩。, en: "Master, don't take this woman in front of you for a good person. She's a demon, come to trick you.", original: true}
      - {speaker: 旁白, zh: 悟空打了妖精三次，唐僧非常生气。, en: "Wukong struck the demon three times, and Tang Sanzang was furious."}
      - {speaker: 唐僧, zh: 我不要你做徒弟。, en: "I don't want you as my disciple.", original: true}
      - {speaker: 孙悟空, zh: 你不要我做徒弟，只怕你西天路去不成。, en: "If you won't have me as your disciple, I'm afraid you'll never make it to the West.", original: true}
      - {speaker: 唐僧, zh: 这个猴子胡说，就有这许多妖怪？, en: "This monkey talks nonsense. Are there really so many demons?", original: true}
  - id: novel-34
    stage: 25
    title: 第三十四回 葫芦 The Gourd That Calls Your Name (novel)
    source: novel, chapter 34
    lines:
      - {speaker: 旁白, zh: 银角大王有一个宝葫芦。他叫谁的名字，谁一答应，就会被装进去。, en: "The Silver Horn King had a treasure gourd. Whoever answered when he called their name was sucked inside."}
      - {speaker: 银角大王, zh: 我也不与你交兵，我且叫你一声，你敢应我么？, en: "I won't fight you. I'll just call your name once. Do you dare answer me?", original: true}
      - {speaker: 孙悟空, zh: 可怕你叫上千声，我就答应你万声！, en: "Call me a thousand times and I'll answer you ten thousand!", original: true}
      - {speaker: 银角大王, zh: 者行孙。, en: "Zhe Xingsun!", original: true}
      - {speaker: 孙悟空, zh: 我真名字叫做孙行者，起的鬼名字叫做者行孙。真名字可以装得，鬼名字好道装不得。, en: "My real name is Sun Xingzhe; the made-up one is Zhe Xingsun. A real name can be caught, but surely a fake one can't.", original: true}
      - {speaker: 旁白, zh: 他忍不住答应了一声，就被吸进了葫芦里。, en: "He couldn't help answering once, and was sucked into the gourd."}
      - {speaker: 孙悟空, zh: 天呀！孤拐都化了。, en: "Heavens! My ankles have melted away!", original: true}
      - {speaker: 旁白, zh: 其实悟空没有化，他想骗妖怪打开葫芦。, en: "Wukong hadn't melted at all. He wanted to trick the demon into opening the gourd."}
  - id: novel-59
    stage: 50
    title: 第五十九回 火焰山 The Flaming Mountains (novel)
    source: novel, chapter 59
    lines:
      - {speaker: 唐僧, zh: 如今正是秋天，却怎返有热气？, en: "It's autumn now, so why is it hot instead?", original: true}
      - {speaker: 猪八戒, zh: 哥啊！据你说，不是日落之处，为何这等酷热？, en: "Brother! If this isn't where the sun sets, as you say, why is it so scorching?", original: true}
      - {speaker: 沙悟净, zh: 想是天时不正，秋行夏令故也。, en: "Perhaps the seasons are out of order, and autumn is keeping summer's rules.", original: true}
      - {speaker: 老者, zh: 敝地唤做火焰山，无春无秋，四季皆热。, en: "Our place is called the Flaming Mountains. There is no spring and no autumn; all four seasons are hot.", original: true}
      - {speaker: 旁白, zh: 悟空去翠云山芭蕉洞，找铁扇公主借扇子。, en: "Wukong went to the Banana Leaf Cave on Emerald Cloud Mountain to borrow the fan from Princess Iron Fan."}
      - {speaker: 铁扇公主, zh: 这泼猴！今日来了。, en: "That wretched monkey! So today he's come.", original: true}
      - {speaker: 孙悟空, zh: 嫂嫂，老孙在此奉揖。, en: "Sister-in-law, old Sun bows to you.", original: true}
      - {speaker: 铁扇公主, zh: 谁是你的嫂嫂？那个要你奉揖？, en: "Who's your sister-in-law? Who wants your bows?", original: true}
  - id: novel-100
    stage: 81
    title: 第一百回 径回东土 Home to the East (novel)
    source: novel, chapter 100
    lines:
      - {speaker: 旁白, zh: 唐僧带着真经回到长安，皇帝太宗亲自出来迎接。, en: "Tang Sanzang returned to Chang'an with the true scriptures, and Emperor Taizong came out to greet him in person."}
      - {speaker: 太宗, zh: 御弟来也？, en: "Has my imperial brother come?", original: true}
      - {speaker: 太宗, zh: 久劳远涉，今已贞观二十七年矣。, en: "After such long labors and far travels, it is now the twenty-seventh year of Zhenguan.", original: true}
      - {speaker: 唐僧, zh: 小徒俱是山村旷野之妖身，未谙中华圣朝之礼数，万望主公赦罪。, en: "My disciples are all demons from wild hills and villages and don't know the manners of the sacred court. I beg Your Majesty to pardon them.", original: true}
      - {speaker: 太宗, zh: 不罪他，不罪他。都同请东阁赴宴去也。, en: "No blame, no blame. Come, all of you, to the banquet in the East Pavilion.", original: true}
      - {speaker: 旁白, zh: 最后，师徒都回到灵山，得到了佛祖的封赏。, en: "In the end, master and disciples all returned to Spirit Mountain and received the Buddha's rewards."}
      - {speaker: 猪八戒, zh: 他们都成佛，如何把我做个净坛使者？, en: "They all become Buddhas, so why make me the Altar Cleanser?", original: true}

