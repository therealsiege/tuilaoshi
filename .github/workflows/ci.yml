name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build mandarin
        run: go build ./cmd/mandarin

      - name: Build generate
        run: go build ./cmd/generate

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
