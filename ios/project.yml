name: TuiLaoShi
options:
  bundleIdPrefix: com.therealsiege
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: VZ9ME548RL
    SWIFT_VERSION: "6.0"
targets:
  TuiLaoShi:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - framework: build/TuiLaoShiCore.xcframework
        embed: true
    postBuildScripts:
      - name: Copy the wiki (content only)
        script: ./copy-wiki.sh
        basedOnDependencyAnalysis: false
    entitlements:
      path: App/TuiLaoShi.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 推老师
        # From the build settings: MARKETING_VERSION below, and the build
        # number passed in by `make ios-archive` (git rev-list --count HEAD).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only HTTPS to the game's server (Go's standard crypto/tls) plus
        # Apple's Keychain and Sign in with Apple: exempt, no documentation.
        ITSAppUsesNonExemptEncryption: false
        # The game's server (web/, Vercel project 1putt/tuilaoshi).
        TLSServer: https://tuilaoshi.vercel.app
        UILaunchScreen: {}
        # Exports show in the Files app.
        UIFileSharingEnabled: true
        NSMicrophoneUsageDescription: Shadowing listens while you say a line back, to show which characters were heard.
        NSSpeechRecognitionUsageDescription: Shadowing turns what you say into Chinese text, on this iPhone where it can, to score it by character.
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.therealsiege.tuilaoshi
        CODE_SIGN_STYLE: Automatic
        # iPhone only: portrait-only on iPad would fail the upload's
        # multitasking check, and iPad would need its own screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TuiLaoShiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["Fixture/**"]
      - path: Tests/Fixture
        type: folder
        buildPhase: resources
    dependencies:
      - target: TuiLaoShi
      - framework: build/TuiLaoShiCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.therealsiege.tuilaoshi.tests
        GENERATE_INFOPLIST_FILE: YES
  TuiLaoShiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TuiLaoShi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.therealsiege.tuilaoshi.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TuiLaoShi:
    build:
      targets:
        TuiLaoShi: all
        TuiLaoShiTests: [test]
        TuiLaoShiUITests: [test]
    test:
      targets: [TuiLaoShiTests, TuiLaoShiUITests]
