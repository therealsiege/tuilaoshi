name: TuiLaoShi
options:
  bundleIdPrefix: com.therealsiege
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: VZ9ME548RL
    SWIFT_VERSION: "6.0"
targets:
  TuiLaoShi:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - framework: build/TuiLaoShiCore.xcframework
        embed: true
    postBuildScripts:
      - name: Copy the wiki (content only)
        script: ./copy-wiki.sh
        basedOnDependencyAnalysis: false
    entitlements:
      path: App/TuiLaoShi.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 推老师
        # The game's server (web/); empty until it is deployed.
        TLSServer: ""
        UILaunchScreen: {}
        # Exports show in the Files app.
        UIFileSharingEnabled: true
        NSMicrophoneUsageDescription: Shadowing listens while you say a line back, to show which characters were heard.
        NSSpeechRecognitionUsageDescription: Shadowing turns what you say into Chinese text, on this iPhone where it can, to score it by character.
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.therealsiege.tuilaoshi
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TuiLaoShiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["Fixture/**"]
      - path: Tests/Fixture
        type: folder
        buildPhase: resources
    dependencies:
      - target: TuiLaoShi
      - framework: build/TuiLaoShiCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.therealsiege.tuilaoshi.tests
        GENERATE_INFOPLIST_FILE: YES
  TuiLaoShiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TuiLaoShi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.therealsiege.tuilaoshi.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TuiLaoShi:
    build:
      targets:
        TuiLaoShi: all
        TuiLaoShiTests: [test]
        TuiLaoShiUITests: [test]
    test:
      targets: [TuiLaoShiTests, TuiLaoShiUITests]
