# The art bible: every picture artgen paints is composed from these blocks,
# in this order: what kind of picture (camera), who or what it shows (a
# character sheet, or the game's own content for everyone else), where
# (the world and the region's terrain), how it is painted (the direction),
# and what must never appear. Characters keep one design: their sheet here,
# plus the approved picture of them in the refs folder once there is one.
# Designs follow the novel Journey to the West (public domain); the look is
# our own.

direction: clean # Clint picked B, clean painted (Pilgrim's Studio, 2026-11-27); -direction picks another

directions:
  real: >-
    Rendering: photoreal cinematic concept art. Physically believable materials with fine
    detail: weathered stone, wet moss, coarse fur, worn lacquer, rusted iron, frayed silk.
    Volumetric light and drifting mist, deep atmospheric perspective, enormous scale.
    Muted natural palette with warm highlights. Composed like a still from a film shot on a
    35mm lens; shallow depth of field only on portraits.
  clean: >-
    Rendering: clean painterly game illustration with soft cel shading. Simple readable
    silhouettes, broad flat colour areas with gentle gradients, thin dark outlines only on
    the main forms, two-tone shadows. Bright airy daylight, watercolour-soft skies, distant
    shapes fading into pale blue haze. Stylised, never photographic.
  blend: >-
    Rendering: painted realism. Realistic light, atmosphere and material texture, but
    simplified clean shapes and soft cel-shaded forms with visible painterly brushwork.
    Thin dark outlines on the main forms only. Wide vistas with atmospheric haze.

# Rules every picture follows, whatever the direction, so the set reads as one world.
world: >-
  World: Tang-dynasty China in the 7th century and the lands west of it, as told in the
  16th-century novel Journey to the West, where gods, dragons and demons are real.
  Architecture is Tang: broad hipped and gabled roofs with deep eaves and only a gentle
  upturn, bracket sets under the eaves, red-lacquered timber columns, whitewashed or
  rammed-earth walls, grey or green glazed tiles. Gateways are Chinese pailou: two or four pillars carrying a small
  tiled roof with upturned eaves on top; never a bare two-post gate with a curved lintel.
  People wear Tang clothing: round-collared robes with belts, wrap skirts, soft futou caps
  for officials, monks in kasaya over plain robes. Further west the land turns to Central
  Asian oases, deserts and kingdoms, and near the end to Indian kingdoms.
  Palette: jade green, ochre, slate blue and cinnabar red as the main colours, with gold only
  for divine or royal things. Light: one clear sun or moon, key light from the upper left,
  cool shadows. People and demons have believable adult proportions (no chibi, no big
  anime eyes) unless their sheet says otherwise.

never: >-
  Never: text, letters, Chinese characters, calligraphy, signatures, red seal stamps,
  watermarks, borders, frames, devices, user interface. No modern objects. No Japanese
  torii gates (two posts with a curved crossbeam and no roof), Japanese-style pagodas or shrines,
  samurai armour, kimono, split-toe tabi socks or sandals. No Western saddles with a horn. No Ming or Qing
  costume (no queue hairstyles, no mandarin squares). No guns. No gore or nudity.

# The picture kinds: framing and aspect ratio.
kinds:
  portrait:
    ratio: "1:1"
    frame: >-
      Picture: a full-figure character portrait, head to feet, in a three-quarter view,
      centred and filling about two thirds of the height, standing on ground that belongs
      to the place they are met in the story. The background is that place, softly
      out of focus and darker than the figure so the silhouette reads at thumbnail size.
  vista:
    ratio: "16:9"
    frame: >-
      Picture: a wide establishing view of the region from a high vantage point, used as the
      region's title card. The road west winds through it from the right (east) toward the
      left (west); on it, small for scale, the pilgrims as they are by this point in the
      story: {party}.
  map:
    ratio: "21:9"
    frame: >-
      Picture: a walkable game overworld seen from above at a gentle three-quarter angle,
      as if from a hill to the south looking north, the same angle everywhere. Paint the
      attached colour-coded layout faithfully: every coloured area keeps its place, size and
      shape, and nothing is added on the road or moved. No people or animals.
    legend: >-
      Layout colours: dark grey is ground that cannot be walked ({block});
      light green is open ground beside the road that can be walked; tan is the dirt road;
      each yellow square is a stone pailou archway across the road (a gate the pilgrims must
      pass); the red square is a small village of a few Tang houses; a blue square is
      {crossing}.
  scene:
    ratio: "16:9"
    frame: >-
      Picture: a wide cinematic battle cut scene, one still from an animated film of the
      novel, at the moment of highest drama. Dynamic action composition: one clear focal clash
      where the blows meet, set on a strong diagonal; every figure a readable silhouette
      against the background, with clear space between them; motion in the poses, cloth,
      hair, dust and debris; energy effects (sweeping arcs behind weapons, sparks, shockwaves,
      and the magic fire, wind or light the scene names) that lead the eye to the clash.
      Fierce but never gory: no blood, wounds or severed parts.
  town:
    ratio: "9:16"
    frame: >-
      Picture: a tall street-level view of the town, framed for a phone held upright, the
      main gate or street leading the eye into the picture, townsfolk going about their
      day. The lower third is calm (paving, a street, a courtyard) because buttons sit there.

# How each terrain in content/regions.yaml looks. Used for vistas and maps.
terrain:
  mountain:
    look: steep forested ridges and sheer cliffs, pines growing out of rock, clouds in the valleys, narrow switchback paths
    block: steep cliffs, crags and dense pine forest
  forest:
    look: old mixed forest of pine, cypress and maple in deep valleys, streams, moss, shafts of light, a few woodcutters' clearings
    block: dense old forest and rocky outcrops
  river:
    look: a broad river valley with reed banks, willow trees, ferry landings, wet fields and low hills either side
    block: deep fast water and reed marsh
  desert:
    look: wind-carved yellow sandstone, dunes and gravel plains under a hazy sky, a dry riverbed, sparse tamarisk, a distant oasis
    block: dunes, sandstone ridges and dry gullies
  fire:
    look: red and black volcanic rock, cracked ground glowing with embers, heat shimmer and smoke, dead trees, an orange sky
    block: walls of volcanic rock and ground that burns
  palace:
    look: a walled kingdom with a great gate, tiled roofs and towers, avenues, gardens and canals, farmland outside the walls
    block: city walls, palace halls and canals
  cave:
    look: limestone karst peaks riddled with caves, dark cave mouths, mist, twisted trees and bones near the demon's door
    block: sheer karst rock and cave-riddled cliffs

crossings:
  river: a narrow timber bridge or ferry landing over the water
  mountain: a rope bridge over a ravine
  desert: a line of cairns marking the safe way across the sand
  fire: a path of cooled black rock through the burning ground
  default: a rope bridge over a ravine

# How each companion looks when small on the road, for vistas. Only those
# who have joined by the end of the region are painted.
party:
  唐僧: a monk in a crimson kasaya riding a horse
  孙悟空: a small golden monkey with a black iron staff walking ahead
  白龙马: his horse is pure white
  猪八戒: a stout pig-faced man in a dark robe with a long rake on his shoulder
  沙悟净: a tall blue-faced man with red hair carrying the luggage on a shoulder pole

# Character sheets: one fixed design for each recurring character, from the
# novel's own descriptions. Everyone else is drawn from their entry in the
# bestiary, soldiers or spirits content.
characters:
  唐僧: >-
    Tang Sanzang, the monk: a gentle, handsome man of about thirty with a shaven head and a calm,
    kind face. He wears plain grey-brown monk's robes under the brocade kasaya given to him by
    the Bodhisattva Guanyin: a crimson robe of patchwork panels edged in gold, set with small
    jewels. He holds the nine-ringed monk's staff, a tall tin staff topped with nine loose
    rings, and a string of wooden prayer beads. On formal occasions he wears the Vairocana
    crown, a five-panelled monk's crown. He rides a white horse. He never fights.
  孙悟空: >-
    Sun Wukong, the Monkey King: a grown warrior, not a child or a cute cartoon monkey. Born
    from a stone; shorter than the other pilgrims (about shoulder height to Tang Sanzang) but
    adult, lean and hard-muscled, standing upright with a man's posture, a man's hands and a
    fighter's balance. Golden-brown fur, a hairless, sharp-beaked face like a thunder god with
    a mature, knowing, battle-worn expression, and
    fiery golden eyes rimmed with red from forty-nine days in Laozi's furnace. A plain gold
    band, the tightening fillet, circles his head. He wears a short tiger-skin kilt over a
    plain cotton monk's tunic tied with a cord, and soft cloth boots. His weapon is the
    As-You-Will Gold-Banded Staff: a plain black iron pole with a gold band at each end.
    Restless, cocky, always about to move.
  猪八戒: >-
    Zhu Bajie, Pigsy: a big, stout man with a pig's head: a man's body, hands and bearing,
    and a face that is a pig's but with human expressions (a sly grin, lazy half-closed
    eyes). A long snout, huge fan-like ears, bristly dark skin and a round belly. Once Marshal
    Tianpeng of Heaven's navy, and he still stands like an old soldier gone soft. He wears a dark blue-black monk's robe with a cloth belt, sleeves rolled up. He
    carries the nine-toothed iron rake on a long handle over his shoulder: exactly nine long
    iron teeth in one row. He wears plain cloth shoes. Lazy, greedy,
    good-natured.
  沙悟净: >-
    Sha Wujing, Sandy: a tall, gaunt, solemn man with an indigo-blue face, round staring
    eyes, and a shock of bristling red hair and beard. Around his neck hangs a string of nine
    small skulls from his years as a river ogre. He wears a plain monk's robe and carries
    the pilgrims' luggage on a shoulder pole, and his weapon, the precious demon-quelling
    staff: a long, straight staff of pale moon-tree wood wound with gold, with no blade or spade
    at either end. Quiet and steady.
  白龙马: >-
    Bai Longma, the White Dragon Horse: a dragon prince of the Western Sea turned into a
    horse, and it shows: a character, not an ordinary animal. A tall white horse with a proud,
    intelligent, almost human gaze and a prince's bearing; faint pearly dragon scales along
    his legs, neck and spine; a long silver-white mane and tail that flow like a dragon's,
    with whisker-like tendrils at the muzzle and two small pale-gold horn buds on his brow; wearing a Tang-dynasty saddle (a
    flat padded saddle over an embroidered saddle cloth, no horn) and a bridle of tooled
    leather with gold fittings. In dragon form he is a long white dragon with silver
    scales, a flowing mane and pale gold horns.
  混世魔王: >-
    The Havoc Demon King: a towering demon in a black-gold helmet, a black silk robe over
    black iron armour bound with leather straps, and patterned boots, gripping a huge broad
    blade. A brute who rules a cave of minor demons. Met at his own cave, the Water-Belly
    Cave (水脏洞) on Kanyuan Mountain.
  斑斓虎: >-
    The Striped Tiger: a huge wild tiger of the hills below Two Boundary Mountain, orange
    with bold black stripes, crouched to spring from long grass with its ears flat and teeth
    bared. An animal, not a demon in clothes: no armour, no weapons, no human posture. Its skin
    becomes Sun Wukong's tiger-skin kilt.
  白骨精: >-
    The White Bone Demon: a corpse demon on White Tiger Ridge. Her true form is a skeleton of
    pale bone; her disguise is a lovely young village woman in a plain Tang wrap skirt
    carrying a basket of food. Paint the disguise, with the truth showing: her shadow on the
    ground is a skeleton, her fingers too thin, a faint cold mist around her feet.
  金角大王: >-
    The Gold Horn King: one of the two demon kings of Lotus Flower Cave on Flat-Top Mountain,
    really a furnace boy of Laozi come down to earth. A large demon with a single golden horn
    on his brow, in a rich robe over light armour, holding the seven-star sword. In the novel
    the purple-gold gourd that sucks in anyone who answers when their name is called is
    carried by his younger brother, the Silver Horn King.
  银角大王: >-
    The Silver Horn King: the younger of the two demon kings of Lotus Flower Cave on Flat-Top
    Mountain, Laozi's other furnace boy. A large demon with a single silver horn on his brow
    and a sly, clever face, in a rich robe over light armour. He carries the purple-gold red
    gourd, a gourd of reddish gold about as long as a forearm with a stopper, which sucks in
    anyone who answers when he calls their name, and keeps the mutton-fat jade vase and the
    golden binding rope at his belt.
  红孩儿: >-
    Red Boy: a demon who looks like a boy of about seven with a red face and his hair in
    two small tufts, bare-chested in a red embroidered belly-cloth and trousers, holding the
    fire-tipped spear. A human boy's body: no tail, horns or animal parts. He breathes the Samadhi true fire from his mouth and nose. Son of the
    Bull Demon King. Met among the burning peaks of Mount Hao.
  铁扇公主: >-
    Princess Iron Fan, the Rakshasi: the Bull Demon King's wife and Red Boy's mother, of
    Palm-Leaf Cave on Emerald Cloud Mountain. A tall, handsome, fierce woman, fully clothed:
    her hair wrapped in a flowered kerchief, an embroidered robe patterned with clouds, a
    double sash of tiger sinew at her waist over an embroidered skirt, a pair of blue-steel
    swords. Her treasure is the plantain fan: a huge fan shaped like one broad green-gold
    plantain leaf on a short handle, taller than a man when full size; one wave of it
    raises a hurricane or puts out the Flaming Mountain. Not a demon in looks, but proud
    and angry.
  牛魔王: >-
    The Bull Demon King: a huge demon with the head of a black bull and great curved horns,
    in black iron armour and a dark robe, wielding a mixed-iron cudgel: a long, plain, straight
    rod of iron, with no spikes, knobs or blade. Once Sun Wukong's
    sworn brother. Met near the Flaming Mountain.
  蜘蛛精: >-
    The Spider Spirits: seven sisters of Silk Cave, beautiful women in pale silk robes, fully
    clothed, who spin binding silk and can turn into spiders as big as a man. Webs of
    shining silk across the cave mouth and the trees.
  金翅大鹏: >-
    The Golden-Winged Roc: a mighty bird demon with a hooked golden beak, fierce eyes and
    vast golden wings, in demon-king armour, holding a long painted halberd. One flap of his
    wings carries him ninety thousand li. Rules Lion Camel Ridge.
  二郎神: >-
    Erlang Shen, the Illustrious Sage True Lord Erlang, the Jade Emperor's nephew: a god, never
    a demon. A handsome, upright young warrior with a calm, stern face, long ears, and a third
    eye set upright in the middle of his forehead. He wears the three-mountain cap with
    flying phoenix wings, a robe of pale goose-yellow over golden armour, a jade belt set with
    treasures, gold-threaded boots, and a crescent-moon slingshot at his waist. His weapon is
    the three-pointed, double-edged blade: a long polearm whose head has three prongs, the
    middle one a long two-edged blade.
  哮天犬: >-
    The Howling Celestial Dog, Erlang Shen's hunting hound: a lean, deep-chested, long-legged
    sighthound with a short dark grey-black coat, pricked ears and bared teeth, fast as a
    thrown spear. An animal, not a demon: no armour, no clothes, no human posture.
  如来佛祖: >-
    The Buddha at Thunderclap Monastery on Vulture Peak: serene and enormous, seated in
    meditation on a lotus throne, robed in gold, with a halo of soft light, attended by
    disciples and bodhisattvas among clouds. Painted with reverence, never as a demon.

# Battle cut scenes, from the novel: who strikes whom, with what, where, and
# the moment of highest drama. Stage is the tribulation it plays at (its
# region gives the place unless place says otherwise); cast are the
# characters in it by Chinese name, each with a sheet above.
scenes:
  - id: baigu-strike
    stage: 20
    cast: [孙悟空, 白骨精, 唐僧]
    text: >-
      Chapter 27. On a lonely path over White Tiger Ridge, the White Bone Demon has come to the
      pilgrims disguised as a lovely young village woman carrying a basket of food. Sun Wukong,
      back from begging alms, sees through her with his fiery golden eyes and strikes: he
      leaps in from the upper left with the Gold-Banded Staff raised high in both hands and
      brings it down on her. At the instant of the blow the disguise splits like a shell and
      her true form shows through it: a tall skeleton of pale white bone wreathed in cold grey
      mist, tearing loose from the woman's body and fleeing upward, while the empty disguise
      crumples and her basket spills on the path. Behind on the right, Tang Sanzang in his
      crimson kasaya throws up his hands in horror, sure his disciple has killed an innocent
      girl.
  - id: erlang-havoc
    stage: 8
    cast: [孙悟空, 二郎神, 哮天犬]
    place: >-
      Flower-Fruit Mountain (花果山), Sun Wukong's home in the Eastern Continent: green peaks
      above the sea, waterfalls and the Water-Curtain Cave, ringed by Heaven's armies
      encamped on the clouds. This is a memory of the havoc in Heaven, before the pilgrimage.
    text: >-
      Chapter 6, the havoc in Heaven. When all of Heaven's armies have failed, the Illustrious
      Sage Erlang comes to Flower-Fruit Mountain to fight the Monkey King. They clash in the
      air above the peaks: Erlang, his third eye blazing, drives his three-pointed,
      double-edged blade (a long polearm with a three-pronged head, never a sword) down at
      Wukong, who parries with the Gold-Banded Staff. From the
      clouds above, Laozi, an old Daoist sage in pale robes, drops his Diamond Snare, a solid
      steel ring like a thick bracelet (not a rope or a loop of cord), which strikes Wukong on the crown of the head so he staggers, and at that
      moment the Howling Celestial Dog leaps up and sinks its teeth into his calf. At this
      point in the story Wukong has not yet joined the pilgrimage: no gold band on his head, no monk's
      tunic, no tiger-skin kilt. He wears the phoenix-plumed cap of purple gold with two long
      pheasant plumes, a coat of golden chain mail and cloud-walking boots, taken from the
      Dragon Kings; his face, fur and staff are as always. Erlang's sworn brothers and
      heavenly soldiers are small in the clouds behind.
  - id: redboy-fire
    stage: 31
    cast: [红孩儿, 孙悟空]
    text: >-
      Chapter 41. Before the Fire Cloud Cave in Withered Pine Ravine on Mount Hao, little demons
      have pushed out five small wooden carts and set them in the five-element pattern. Red
      Boy stands among them, his fire-tipped spear in one hand; he has struck his own nose
      twice with his fist, and the Samadhi true fire roars out of his mouth and nostrils in a
      great red-gold torrent while flame and thick smoke pour from the five carts. The fire
      engulfs Sun Wukong, who charges in from the left with the Gold-Banded Staff held before
      his face and his other hand in the fire-warding sign, eyes streaming in the smoke.
      Above, the Dragon Kings of the Four Seas pour rain from dark clouds, but ordinary water
      only makes the Samadhi fire blaze higher, steam bursting where rain meets flame.
  - id: bull-flaming
    stage: 52
    cast: [孙悟空, 牛魔王, 铁扇公主]
    text: >-
      Chapter 61. Near the Flaming Mountain, whose slopes burn for eight hundred li, Sun Wukong
      and the Bull Demon King, once sworn brothers, fight in the air above the burning ridge:
      Wukong's Gold-Banded Staff meets the Bull Demon King's mixed-iron cudgel in a burst of
      sparks and a shockwave through the smoke, the huge bull-headed demon bearing down from
      the right, Wukong driving up from the left. Below them at the mouth of Palm-Leaf Cave,
      on a green cliff at the edge of the fire, Princess Iron Fan stands with the great
      plantain fan raised in both hands, the treasure they are fighting over, the only thing
      that can put out the mountain.
  - id: gourd-pingding
    stage: 25
    cast: [银角大王, 金角大王, 孙悟空]
    text: >-
      Chapters 34-35, outside Lotus Flower Cave on Flat-Top Mountain. The demon kings know that
      the purple-gold red gourd sucks in anyone who answers when their name is called. Sun
      Wukong has come to challenge them under a false name, and in the novel it is the Silver
      Horn King who holds the gourd: he stands on a rock with the gourd held mouth-down toward
      Wukong and calls his name; Wukong answers, and a howling whirlwind bursts from the
      gourd's mouth and drags him through the air toward it, his body stretching into a streak
      of golden light, his staff flung out of his hands. The Gold Horn King, his elder
      brother, stands at his shoulder with the seven-star sword raised, laughing. Small
      demons with plain banners and spears crowd the cave mouth behind: a dark, rough cave
      opening in the cliff, with no gate, archway, plaque or signboard.
  - id: roc-lion-camel
    stage: 64
    cast: [金翅大鹏, 孙悟空, 猪八戒, 沙悟净, 白龙马, 唐僧]
    text: >-
      Chapters 75-77, before the demon city of Lion-Camel Ridge, its walls grim and piled with
      bones. The Golden-Winged Roc swoops down out of the sky, his vast golden wings blotting
      out the sun, his long painted halberd thrust forward. All four disciples meet him
      together: Sun Wukong leaps up into the air to meet him, staff against halberd at the
      centre of the picture; Zhu Bajie swings his rake (exactly nine long iron teeth in one row) up at the Roc from the
      left; Sha Wujing thrusts his demon-quelling staff (a plain straight staff, no blade or spade) from the right; and behind them the
      White Dragon Horse rears up to shield Tang Sanzang, who sits on his back clutching his
      prayer beads. Wind from the Roc's wings tears at their robes and flattens the grass.
