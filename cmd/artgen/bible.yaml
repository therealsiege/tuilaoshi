# The art bible: every picture artgen paints is composed from these blocks,
# in this order: what kind of picture (camera), who or what it shows (a
# character sheet, or the game's own content for everyone else), where
# (the world and the region's terrain), how it is painted (the direction),
# and what must never appear. Characters keep one design: their sheet here,
# plus the approved picture of them in the refs folder once there is one.
# Designs follow the novel Journey to the West (public domain); the look is
# our own.

direction: clean # Clint picked B, clean painted (Pilgrim's Studio, 2026-11-27); -direction picks another

directions:
  real: >-
    Rendering: photoreal cinematic concept art. Physically believable materials with fine
    detail: weathered stone, wet moss, coarse fur, worn lacquer, rusted iron, frayed silk.
    Volumetric light and drifting mist, deep atmospheric perspective, enormous scale.
    Muted natural palette with warm highlights. Composed like a still from a film shot on a
    35mm lens; shallow depth of field only on portraits.
  clean: >-
    Rendering: clean painterly game illustration with soft cel shading. Simple readable
    silhouettes, broad flat colour areas with gentle gradients, thin dark outlines only on
    the main forms, two-tone shadows. Bright airy daylight, watercolour-soft skies, distant
    shapes fading into pale blue haze. Stylised, never photographic.
  blend: >-
    Rendering: painted realism. Realistic light, atmosphere and material texture, but
    simplified clean shapes and soft cel-shaded forms with visible painterly brushwork.
    Thin dark outlines on the main forms only. Wide vistas with atmospheric haze.

# Rules every picture follows, whatever the direction, so the set reads as one world.
world: >-
  World: Tang-dynasty China in the 7th century and the lands west of it, as told in the
  16th-century novel Journey to the West, where gods, dragons and demons are real.
  Architecture is Tang: broad hipped and gabled roofs with deep eaves and only a gentle
  upturn, bracket sets under the eaves, red-lacquered timber columns, whitewashed or
  rammed-earth walls, grey or green glazed tiles. Gateways are Chinese pailou: two or four pillars carrying a small
  tiled roof with upturned eaves on top; never a bare two-post gate with a curved lintel.
  People wear Tang clothing: round-collared robes with belts, wrap skirts, soft futou caps
  for officials, monks in kasaya over plain robes. Further west the land turns to Central
  Asian oases, deserts and kingdoms, and near the end to Indian kingdoms.
  Palette: jade green, ochre, slate blue and cinnabar red as the main colours, with gold only
  for divine or royal things. Light: one clear sun or moon, key light from the upper left,
  cool shadows. People and demons have believable adult proportions (no chibi, no big
  anime eyes) unless their sheet says otherwise.

never: >-
  Never: text, letters, Chinese characters, calligraphy, signatures, red seal stamps,
  watermarks, borders, frames, devices, user interface. No modern objects. No Japanese
  torii gates (two posts with a curved crossbeam and no roof), Japanese-style pagodas or shrines,
  samurai armour, kimono, split-toe tabi socks or sandals. No Western saddles with a horn. No Ming or Qing
  costume (no queue hairstyles, no mandarin squares). No guns. No gore or nudity.

# The picture kinds: framing and aspect ratio.
kinds:
  portrait:
    ratio: "1:1"
    frame: >-
      Picture: a full-figure character portrait, head to feet, in a three-quarter view,
      centred and filling about two thirds of the height, standing on ground that belongs
      to the place they are met in the story. The background is that place, softly
      out of focus and darker than the figure so the silhouette reads at thumbnail size.
  vista:
    ratio: "16:9"
    frame: >-
      Picture: a wide establishing view of the region from a high vantage point, used as the
      region's title card. The road west winds through it from the right (east) toward the
      left (west); on it, small for scale, the pilgrims as they are by this point in the
      story: {party}.
  map:
    ratio: "21:9"
    frame: >-
      Picture: a walkable game overworld seen from above at a gentle three-quarter angle,
      as if from a hill to the south looking north, the same angle everywhere. Paint the
      attached colour-coded layout faithfully: every coloured area keeps its place, size and
      shape, and nothing is added on the road or moved. No people or animals.
    legend: >-
      Layout colours: dark grey is ground that cannot be walked ({block});
      light green is open ground beside the road that can be walked; tan is the dirt road;
      each yellow square is a stone pailou archway across the road (a gate the pilgrims must
      pass); the red square is a small village of a few Tang houses; a blue square is
      {crossing}.
  scene:
    ratio: "16:9"
    frame: >-
      Picture: a wide cinematic battle cut scene, one still from an animated film of the
      novel, at the moment of highest drama. Dynamic action composition: one clear focal clash
      where the blows meet, set on a strong diagonal; every figure a readable silhouette
      against the background, with clear space between them; motion in the poses, cloth,
      hair, dust and debris; energy effects (sweeping arcs behind weapons, sparks, shockwaves,
      and the magic fire, wind or light the scene names) that lead the eye to the clash.
      Fierce but never gory: no blood, wounds or severed parts.
  sheet:
    ratio: "16:9"
    frame: >-
      Picture: a character model sheet for animators, the one design every other picture of
      this character copies. A plain, flat, very light warm-grey background with nothing on
      it: no scenery, no ground, no props, no shadows but a soft one under the feet. Left to
      right in a row, the same character exactly four times, full figure head to feet (or nose
      to tail), at the same scale and standing in the same neutral pose, each from a different
      side: from the front, in three-quarter view, from the side in full profile, and from the
      back. Paint every part of them in every view, a tail included. Along the right-hand edge,
      two close-ups: one of the face, head and shoulders, and one of the weapon, whole and
      level, so every detail of it can be counted; it is the very same weapon the figures
      hold, with the same count of teeth or rings, the same bands and the same ends (a
      character with no weapon shows their saddle and bridle instead). Every view shows the
      same face, build, costume, colours and weapon. No text, labels, arrows, numbers, rulers,
      grids, colour swatches or panel borders.
  town:
    ratio: "9:16"
    frame: >-
      Picture: a tall street-level view of the town, framed for a phone held upright, the
      main gate or street leading the eye into the picture, townsfolk going about their
      day. The lower third is calm (paving, a street, a courtyard) because buttons sit there.

# How each terrain in content/regions.yaml looks. Used for vistas and maps.
terrain:
  mountain:
    look: steep forested ridges and sheer cliffs, pines growing out of rock, clouds in the valleys, narrow switchback paths
    block: steep cliffs, crags and dense pine forest
  forest:
    look: old mixed forest of pine, cypress and maple in deep valleys, streams, moss, shafts of light, a few woodcutters' clearings
    block: dense old forest and rocky outcrops
  river:
    look: a broad river valley with reed banks, willow trees, ferry landings, wet fields and low hills either side
    block: deep fast water and reed marsh
  desert:
    look: wind-carved yellow sandstone, dunes and gravel plains under a hazy sky, a dry riverbed, sparse tamarisk, a distant oasis
    block: dunes, sandstone ridges and dry gullies
  fire:
    look: red and black volcanic rock, cracked ground glowing with embers, heat shimmer and smoke, dead trees, an orange sky
    block: walls of volcanic rock and ground that burns
  palace:
    look: a walled kingdom with a great gate, tiled roofs and towers, avenues, gardens and canals, farmland outside the walls
    block: city walls, palace halls and canals
  cave:
    look: limestone karst peaks riddled with caves, dark cave mouths, mist, twisted trees and bones near the demon's door
    block: sheer karst rock and cave-riddled cliffs

crossings:
  river: a narrow timber bridge or ferry landing over the water
  mountain: a rope bridge over a ravine
  desert: a line of cairns marking the safe way across the sand
  fire: a path of cooled black rock through the burning ground
  default: a rope bridge over a ravine

# How each companion looks when small on the road, for vistas. Only those
# who have joined by the end of the region are painted.
party:
  唐僧: a monk in a crimson kasaya riding a horse
  孙悟空: a small golden monkey with a black iron staff walking ahead
  白龙马: his horse is pure white
  猪八戒: a stout pig-faced man in a dark robe with a long rake on his shoulder
  沙悟净: a tall blue-faced man with red hair carrying the luggage on a shoulder pole

# Character sheets: one fixed design for each recurring character, from the
# novel's own descriptions. Everyone else is drawn from their entry in the
# bestiary, soldiers or spirits content.
characters:
  唐僧: >-
    Tang Sanzang, the monk: a gentle, handsome man of about thirty with a shaven head and a calm,
    kind face. He wears plain grey-brown monk's robes under the brocade kasaya given to him by
    the Bodhisattva Guanyin: a crimson robe of patchwork panels edged in gold, set with small
    jewels, a gold ring clasp at the left shoulder. He holds the nine-ringed monk's staff, a
    tall plain pewter-grey staff taller than he is, its head an open, pointed, gourd-shaped
    loop of metal with nine loose rings hung on it, and a string of dark wooden prayer beads.
    His shaven head is bare: he wears the Vairocana crown, a five-panelled monk's crown, only
    when a scene names it. Plain cloth shoes. He rides a white horse. He never fights.
  孙悟空: >-
    Sun Wukong, the Monkey King: a grown warrior, not a child or a cute cartoon monkey. Born
    from a stone; shorter than the other pilgrims (about shoulder height to Tang Sanzang) but
    adult, lean and hard-muscled, standing upright with a man's posture, a man's hands and a
    fighter's balance. Golden-brown fur, a hairless, sharp-beaked face like a thunder god with
    a mature, knowing, battle-worn expression, and
    fiery golden eyes rimmed with red from forty-nine days in Laozi's furnace (a thin red rim
    round each eye only, never a red mask or face paint). A plain gold band, the tightening
    fillet, circles his head, with a small curl at the front. His costume, every piece always
    there: a sleeveless off-white cotton monk's tunic worn over one shoulder and across his
    chest like a sash, its skirt hanging to the knee; over it a short tiger-skin kilt, orange
    with black stripes and a ragged fur edge; a knotted rope cord tied round the waist over
    both; bare furred arms and legs below the kilt (no trousers, no sleeves, no armour); and
    soft grey-beige cloth boots to mid-calf. A long monkey's tail. His weapon is the
    As-You-Will Gold-Banded Staff: a plain black iron pole of even thickness, longer than he is
    tall, with a short gold band capping each end. Restless, cocky, always about to move.
  猪八戒: >-
    Zhu Bajie, Pigsy: a big, stout man with a pig's head: a man's body, hands and bearing,
    and a face that is a pig's but with human expressions (a sly grin, lazy half-closed
    eyes). A long snout, huge fan-like ears, bristly dark skin and a round belly. Once Marshal
    Tianpeng of Heaven's navy, and he still stands like an old soldier gone soft. Pink-brown
    pig's skin with a few dark bristles. He wears a dark blue-black monk's robe to the shin
    with a grey-beige cloth belt knotted at the front, sleeves rolled up to the elbow, white
    leg wrappings and plain dark cloth shoes. He carries the nine-toothed iron rake on a long
    wooden handle over his shoulder: the handle as long as he is tall, and on its end a dark
    iron crossbar with exactly nine long, straight iron teeth in one row, never six, seven or
    eight. Only one rake. Lazy, greedy, good-natured.
  沙悟净: >-
    Sha Wujing, Sandy: a tall, gaunt, solemn man with indigo-blue skin on his face and hands,
    round staring eyes, and a shock of bristling flame-red hair and a full red beard, always
    showing, never covered by a cap, hood or headband. Around his neck hangs a string of nine
    small skulls from his years as a river ogre. He wears a plain ochre-brown monk's robe with
    a cloth belt and dark boots, and carries the pilgrims' luggage, cloth bundles and a rolled
    mat tied to a shoulder pole (never a backpack). His weapon is the precious demon-quelling
    staff: a long, perfectly straight staff of pale moon-tree wood, the same thickness from end
    to end, with plain round-cut ends and gold bands wound round it near each end and at the
    middle; no flared, knobbed or bone-shaped ends, no blade or spade. Quiet and steady.
  白龙马: >-
    Bai Longma, the White Dragon Horse: a dragon prince of the Western Sea turned into a
    horse, and it shows: a character, not an ordinary animal. A tall white horse with a proud,
    intelligent, almost human gaze and a prince's bearing; faint pearly dragon scales along
    his legs, neck and spine; a long silver-white mane and tail that flow like a dragon's,
    with whisker-like tendrils at the muzzle and two small pale-gold branching horns on his brow,
    always showing; always saddled and bridled unless the scene says otherwise, with a
    Tang-dynasty saddle (a flat padded brown leather saddle over an embroidered red and green
    saddle cloth, no horn) and a bridle of tooled brown leather with gold fittings. In dragon
    form he is a long white dragon with silver scales, a flowing mane and pale gold horns.
  混世魔王: >-
    The Havoc Demon King: a towering demon in a black-gold helmet, a black silk robe over
    black iron armour bound with leather straps, and patterned boots, gripping a huge broad
    blade. A brute who rules a cave of minor demons. Met at his own cave, the Water-Belly
    Cave (水脏洞) on Kanyuan Mountain.
  斑斓虎: >-
    The Striped Tiger: a huge wild tiger of the hills below Two Boundary Mountain, orange
    with bold black stripes, crouched to spring from long grass with its ears flat and teeth
    bared. An animal, not a demon in clothes: no armour, no weapons, no human posture. Its skin
    becomes Sun Wukong's tiger-skin kilt.
  白骨精: >-
    The White Bone Demon: a corpse demon on White Tiger Ridge. Her true form is a skeleton of
    pale bone; her disguise is a lovely young village woman in a plain Tang wrap skirt
    carrying a basket of food. Paint the disguise, with the truth showing: her shadow on the
    ground is a skeleton, her fingers too thin, a faint cold mist around her feet.
  金角大王: >-
    The Gold Horn King: one of the two demon kings of Lotus Flower Cave on Flat-Top Mountain,
    really a furnace boy of Laozi come down to earth. A large demon with a single golden horn
    on his brow, in a rich robe over light armour, holding the seven-star sword. In the novel
    the purple-gold gourd that sucks in anyone who answers when their name is called is
    carried by his younger brother, the Silver Horn King.
  银角大王: >-
    The Silver Horn King: the younger of the two demon kings of Lotus Flower Cave on Flat-Top
    Mountain, Laozi's other furnace boy. A large demon with a single silver horn on his brow
    and a sly, clever face, in a rich robe over light armour. He carries the purple-gold red
    gourd, a gourd of reddish gold about as long as a forearm with a stopper, which sucks in
    anyone who answers when he calls their name, and keeps the mutton-fat jade vase and the
    golden binding rope at his belt.
  红孩儿: >-
    Red Boy: a demon who looks like a boy of about seven with a red face and his hair in
    two small tufts, bare-chested in a red embroidered belly-cloth and trousers, holding the
    fire-tipped spear. A human boy's body: no tail, horns or animal parts. He breathes the Samadhi true fire from his mouth and nose. Son of the
    Bull Demon King. Met among the burning peaks of Mount Hao.
  铁扇公主: >-
    Princess Iron Fan, the Rakshasi: the Bull Demon King's wife and Red Boy's mother, of
    Palm-Leaf Cave on Emerald Cloud Mountain. A tall, handsome, fierce woman, fully clothed:
    her hair wrapped in a flowered kerchief, an embroidered robe patterned with clouds, a
    double sash of tiger sinew at her waist over an embroidered skirt, a pair of blue-steel
    swords. Her treasure is the plantain fan: a huge fan shaped like one broad green-gold
    plantain leaf on a short handle, taller than a man when full size; one wave of it
    raises a hurricane or puts out the Flaming Mountain. Not a demon in looks, but proud
    and angry.
  牛魔王: >-
    The Bull Demon King: a huge demon with the head of a black bull and great curved horns,
    in black iron armour and a dark robe, wielding a mixed-iron cudgel: a long, plain, straight
    rod of iron as long as he is tall, the same thickness from end to end like an iron pole,
    with no spikes, knobs, pommel or blade; never a club, bat or mace. Once Sun Wukong's
    sworn brother. Met near the Flaming Mountain.
  蜘蛛精: >-
    The Spider Spirits: seven sisters of Silk Cave, beautiful women in pale silk robes, fully
    clothed, who spin binding silk and can turn into spiders as big as a man. Webs of
    shining silk across the cave mouth and the trees.
  金翅大鹏: >-
    The Golden-Winged Roc: a mighty bird demon with a hooked golden beak, fierce eyes and
    vast golden wings, in demon-king armour, holding a long painted halberd. One flap of his
    wings carries him ninety thousand li. Rules Lion Camel Ridge.
  二郎神: >-
    Erlang Shen, the Illustrious Sage True Lord Erlang, the Jade Emperor's nephew: a god, never
    a demon. A handsome, upright young warrior with a calm, stern face, long ears, and a third
    eye set upright in the middle of his forehead. He wears the three-mountain cap with
    flying phoenix wings, a robe of pale goose-yellow over golden armour, a jade belt set with
    treasures, gold-threaded boots, and a crescent-moon slingshot at his waist. His weapon is
    the three-pointed, double-edged blade: a long polearm whose head has three prongs, the
    middle one a long two-edged blade.
  哮天犬: >-
    The Howling Celestial Dog, Erlang Shen's hunting hound: a lean, deep-chested, long-legged
    sighthound with a short dark grey-black coat, pricked ears and bared teeth, fast as a
    thrown spear. An animal, not a demon: no armour, no clothes, no human posture.
  如来佛祖: >-
    The Buddha at Thunderclap Monastery on Vulture Peak: serene and enormous, seated in
    meditation on a lotus throne, robed in gold, with a halo of soft light, attended by
    disciples and bodhisattvas among clouds. Painted with reverence, never as a demon.
  观音菩萨: >-
    The Bodhisattva Guanyin of the South Sea: a goddess, never a demon. A serene, compassionate
    woman with a face like white jade, eyebrows like little crescent moons and a small red
    mouth, her black hair coiled high in a dragon-coil knot under a jewelled crown. She wears a
    plain white silk robe fastened with green jade buttons, a brocade skirt, strings of pearls
    and kingfisher jewels at her breast, and silk sashes that float about her. She holds a
    slender white jade vase of sweet dew with a sprig of green willow in it. She stands on a
    lotus or a cloud in a soft halo of auspicious light.
  太上老君: >-
    Laozi, the Supreme Lord Lao of the Tushita Palace, Heaven's great Daoist sage: a god, never
    a demon. A tall, kindly, grave old man with a long white beard, long white eyebrows and a
    high bald brow, his white hair in a topknot. He wears loose pale robes with dark borders and
    a plain cord belt, and carries a horsetail whisk. He travels on auspicious clouds.
  黑熊精: >-
    The Black Bear Demon of Black Wind Cave on Black Wind Mountain: a huge black bear who has
    cultivated the Way until he walks and fights like a man, with a bear's broad black-furred
    head, small fierce eyes and a heavy muzzle. He wears a bowl-shaped iron helmet glinting
    with red lacquer, armour of black gold, a black silk robe over it with wind-catching
    sleeves, and a long dark green silk sash with tassels. His weapon is a long spear with a
    black tassel below its iron head.
  黄风怪: >-
    The Yellow Wind Demon, Great King of Yellow Wind Ridge: a yellow-furred marten who stole
    lamp oil from the Buddha's lamp, now a demon king with a sharp, narrow marten's face,
    bright beady eyes, whiskers and short tawny-yellow fur. He wears a golden helmet with
    pheasant-tail plumes, golden armour with a round breast mirror, a pale goose-yellow silk
    robe over it, a coiled dragon-patterned armour belt, a brocade apron and deerskin boots
    dyed yellow. His weapon is a sharp three-pronged steel trident. He opens his mouth and blows
    the Samadhi wind: a howling yellow storm of sand that blinds even Sun Wukong.
  黄袍怪: >-
    The Yellow Robe Demon of Bowl-Moon Cave, really the Wood Wolf star Kui come down from Heaven:
    a big, powerful demon with an indigo-blue face, white tusks and one great wide mouth, wild
    bristling side whiskers dyed rouge-red, purple moustaches, a hooked nose like a parrot's
    beak, round eyes bright as morning stars, fists like alms bowls and blue feet. A pale yellow
    robe hangs loose across his body, finer than a brocade kasaya. His weapon is a gleaming
    steel scimitar.
  金鱼精: >-
    The Great King of Spiritual Touch, the goldfish from Guanyin's lotus pond, ruler of the
    River of Heaven: a demon king with a fish's round, bulging, glittering eyes, a high bridged
    nose, a broad brow, sharp even teeth, short flame-red hair and long golden whiskers that
    stand out stiff as awls; a sprig of fresh green water-weed in his mouth. He wears a shining
    golden helmet, golden armour that flashes like a rainbow, a jewelled belt of pearls and
    kingfisher stones, and smoky-yellow boots. His weapon is a nine-petalled bronze hammer: a
    red bronze head shaped like a lotus bud on a long handle. Cold wind and water come with him.
  青牛精: >-
    The Single-Horned Rhinoceros King of Golden Helmet Cave on Golden Helmet Mountain, really
    Laozi's runaway green ox: a towering demon with the head of an ox, one jagged horn on his
    brow, bright staring eyes, black skin shining at the roots of his ears, a wide mouth of
    broad yellow teeth, and rough hide and hair as dark blue-green as indigo, sinews hard as
    steel. He wears dark demon-king armour. His weapon is a long steel-pointed spear, and on his
    arm he wears the Diamond Snare: a plain, solid, white-steel ring like a thick bracelet,
    which, thrown, sucks in every weapon and treasure sent against it.
  蝎子精: >-
    The Scorpion Demoness of Pipa Cave on Poison Foe Mountain: a scorpion as big as a pipa
    lute who once stung the Buddha's own hand. In woman's form she is a beautiful, imperious
    woman, fully clothed in an embroidered robe of dark red and gold with a flowered headdress
    and gold hairpins, and behind her rises a great segmented scorpion's tail, dark and
    glossy, curving over her shoulder to a hooked stinger, the poison horse-stake that even
    Sun Wukong cannot bear. Her weapon is a three-pronged steel fork.
  六耳猕猴: >-
    The Six-Eared Macaque, the false Sun Wukong: in every way the double of the Monkey King, a
    grown, lean, hard-muscled monkey warrior with golden-brown fur, a sharp hairless face,
    fiery golden eyes, a plain gold band round his head, the same off-white monk's tunic worn
    over one shoulder like a sash, a short tiger-skin kilt over it tied with a rope cord, bare
    furred legs, soft cloth boots and a black iron staff with a gold band capping each end. Only one thing gives him away, and only to a careful eye: six ears, two
    small extra ears half hidden in the fur above the usual pair. A colder, crueller smile.
  九头虫: >-
    The Nine-Headed Prince Consort of the Jade-Waves Pond under Scattered Rock Mountain, son-in-law
    of the Dragon King there. In his warrior form a tall, fierce demon in a helmet of bright
    silver and silver armour over a dark robe, wielding a crescent-moon spade: a long pole with
    a broad crescent-shaped blade at the head. His true form is a monstrous bird as big as a
    boat, with brocade-patterned feathers and wide wings, and nine heads on long necks rising
    from one body, each with a hooked beak.
  白鹿精: >-
    The State Preceptor of Bhikkhu, really the white deer that the Star of Longevity rides: an
    old Daoist with a long, narrow, deer-like face, a thin white beard and calm, cold eyes. He
    wears a pale goose-yellow hood of cloud brocade, a crane-feather cloak the colour of
    aloeswood, a blue triple-stranded sash, cloud-toed shoes of hemp and kudzu, an embroidered
    pouch at his breast, and leans on a nine-jointed staff of withered vine carved with a
    coiling dragon. His true form is a white deer with branching antlers.
  黄眉怪: >-
    The Yellow-Browed King of Lesser Thunderclap Monastery, really a page boy who struck the
    stone chime for Maitreya Buddha: a broad, heavy demon with unkempt hair bound by a thin, flat
    gold fillet, two bushy yellow eyebrows standing up on end, a fat garlic-bulb nose, a wide
    square mouth with sharp fangs, and staring eyes. He wears a soft pale robe over armour, a
    yellow brocade sash, and carries a short, soft-shafted wolf-tooth mace studded with spikes.
    His treasures are a pair of huge golden cymbals that close on a prisoner like a clam, and a
    plain old cloth sack that swallows people whole.
  白毛鼠精: >-
    The White-Haired Rat Spirit of the Bottomless Cave, the golden-nosed white rat who stole
    the Buddha's lamp oil, Heavenly King Li's adopted daughter: in her chosen form a lovely,
    pale, delicate young woman, fully clothed in a white silk robe and a pale green skirt, her
    hair in a soft knot with a single jade pin, with small sharp features, a faint golden tint
    at the tip of her nose and quick dark eyes. She fights with a pair of double swords.
  玉兔精: >-
    The Jade Rabbit, Chang'e's herb-pounding rabbit from the Moon Palace, posing as the princess
    of the Indian kingdom of Tianzhu: a lovely young royal woman, fully clothed in a princess's
    robes of pale moon-white and rose silk with a jewelled pearl headdress and gold ornaments,
    with a pale, round, gentle face, a faint pink at the nose and long, soft, upright tufts in
    her hair like a rabbit's ears. Her weapon is a short jade pestle for pounding herbs. Her
    true form is a pure white rabbit.

# Framings a scene can pick with frame: instead of the scene kind's battle
# framing. Same 16:9 still, a different moment.
scene_frames:
  entrance: >-
    Picture: a wide cinematic cut scene, one still from an animated film of the novel, at the
    moment a foe is first seen. The newcomer dominates the picture, large, lit dramatically and
    set on a strong diagonal, with their weapon or power plain to see; anyone they confront is
    smaller and reacting, every figure a readable silhouette against the background with clear
    space between them. Motion in cloth, hair, dust and the wind, fire, water or light the scene
    names. Menacing but never gory: no blood, wounds or severed parts.
  story: >-
    Picture: a wide cinematic cut scene, one still from an animated film of the novel, at a
    turning point of the story rather than a fight. One clear focal point where the eye lands
    first, the figures arranged so every one is a readable silhouette with clear space between
    them, gestures and faces that tell the moment without words, and light that sets its mood:
    wonder, relief, warmth or awe. No blood, wounds or gore.
  move: >-
    Picture: a short battle-move cut scene: one character alone, full figure from head to feet,
    in a single clear, dynamic pose that reads at a glance even at thumbnail size, filling about
    two thirds of the height and set a little off centre so the motion has room. No other
    figures. The background is a simple painted backdrop, soft and lower in contrast than the
    figure, so the silhouette stands out; a sweep of motion lines, dust or light follows the
    movement. No blood, wounds or gore.

# Battle cut scenes, from the novel: who strikes whom, with what, where, and
# the moment of highest drama. Stage is the tribulation it plays at (its
# region gives the place unless place says otherwise); cast are the
# characters in it by Chinese name, each with a sheet above. Frame picks
# one of scene_frames; without it a scene is framed as a battle.
scenes:
  - id: baigu-strike
    stage: 20
    cast: [孙悟空, 白骨精, 唐僧]
    text: >-
      Chapter 27. On a lonely path over White Tiger Ridge, the White Bone Demon has come to the
      pilgrims disguised as a lovely young village woman carrying a basket of food. Sun Wukong,
      back from begging alms, sees through her with his fiery golden eyes and strikes: he
      leaps in from the upper left with the Gold-Banded Staff raised high in both hands and
      brings it down on her. At the instant of the blow the disguise splits like a shell and
      her true form shows through it: a tall skeleton of pale white bone wreathed in cold grey
      mist, tearing loose from the woman's body and fleeing upward, while the empty disguise
      crumples and her basket spills on the path. Behind on the right, Tang Sanzang in his
      crimson kasaya throws up his hands in horror, sure his disciple has killed an innocent
      girl.
  - id: erlang-havoc
    stage: 8
    cast: [孙悟空, 二郎神, 哮天犬]
    place: >-
      Flower-Fruit Mountain (花果山), Sun Wukong's home in the Eastern Continent: green peaks
      above the sea, waterfalls and the Water-Curtain Cave, ringed by Heaven's armies
      encamped on the clouds. This is a memory of the havoc in Heaven, before the pilgrimage.
    text: >-
      Chapter 6, the havoc in Heaven. When all of Heaven's armies have failed, the Illustrious
      Sage Erlang comes to Flower-Fruit Mountain to fight the Monkey King. They clash in the
      air above the peaks: Erlang, his third eye blazing, drives his three-pointed,
      double-edged blade (a long polearm with a three-pronged head, never a sword) down at
      Wukong, who parries with the Gold-Banded Staff. From the
      clouds above, Laozi, an old Daoist sage in pale robes, drops his Diamond Snare, a solid
      steel ring like a thick bracelet (not a rope or a loop of cord), which strikes Wukong on the crown of the head so he staggers, and at that
      moment the Howling Celestial Dog leaps up and sinks its teeth into his calf. At this
      point in the story Wukong has not yet joined the pilgrimage: no gold band on his head, no monk's
      tunic, no tiger-skin kilt. He wears the phoenix-plumed cap of purple gold with two long
      pheasant plumes, a coat of golden chain mail and cloud-walking boots, taken from the
      Dragon Kings; his face, fur and staff are as always. Erlang's sworn brothers and
      heavenly soldiers are small in the clouds behind.
  - id: redboy-fire
    stage: 31
    cast: [红孩儿, 孙悟空]
    text: >-
      Chapter 41. Before the Fire Cloud Cave in Withered Pine Ravine on Mount Hao, little demons
      have pushed out five small wooden carts and set them in the five-element pattern. Red
      Boy stands among them, his fire-tipped spear in one hand; he has struck his own nose
      twice with his fist, and the Samadhi true fire roars out of his mouth and nostrils in a
      great red-gold torrent while flame and thick smoke pour from the five carts. The fire
      engulfs Sun Wukong, who charges in from the left with the Gold-Banded Staff held before
      his face and his other hand in the fire-warding sign, eyes streaming in the smoke.
      Above, the Dragon Kings of the Four Seas pour rain from dark clouds, but ordinary water
      only makes the Samadhi fire blaze higher, steam bursting where rain meets flame.
  - id: bull-flaming
    stage: 52
    cast: [孙悟空, 牛魔王, 铁扇公主]
    text: >-
      Chapter 61. Near the Flaming Mountain, whose slopes burn for eight hundred li, Sun Wukong
      and the Bull Demon King, once sworn brothers, fight in the air above the burning ridge:
      Wukong's Gold-Banded Staff meets the Bull Demon King's mixed-iron cudgel in a burst of
      sparks and a shockwave through the smoke, the huge bull-headed demon bearing down from
      the right, Wukong driving up from the left. Below them at the mouth of Palm-Leaf Cave,
      on a green cliff at the edge of the fire, Princess Iron Fan stands with the great
      plantain fan raised in both hands, the treasure they are fighting over, the only thing
      that can put out the mountain.
  - id: gourd-pingding
    stage: 25
    cast: [银角大王, 金角大王, 孙悟空]
    text: >-
      Chapters 34-35, outside Lotus Flower Cave on Flat-Top Mountain. The demon kings know that
      the purple-gold red gourd sucks in anyone who answers when their name is called. Sun
      Wukong has come to challenge them under a false name, and in the novel it is the Silver
      Horn King who holds the gourd: he stands on a rock with the gourd held mouth-down toward
      Wukong and calls his name; Wukong answers, and a howling whirlwind bursts from the
      gourd's mouth and drags him through the air toward it, his body stretching into a streak
      of golden light, his staff flung out of his hands. The Gold Horn King, his elder
      brother, stands at his shoulder with the seven-star sword raised, laughing. Small
      demons with plain banners and spears crowd the cave mouth behind: a dark, rough cave
      opening in the cliff, with no gate, archway, plaque or signboard.
  - id: roc-lion-camel
    stage: 64
    cast: [金翅大鹏, 孙悟空, 猪八戒, 沙悟净, 白龙马, 唐僧]
    text: >-
      Chapters 75-77, before the demon city of Lion-Camel Ridge, its walls grim and piled with
      bones. The Golden-Winged Roc swoops down out of the sky, his vast golden wings blotting
      out the sun, his long painted halberd thrust forward. All four disciples meet him
      together: Sun Wukong leaps up into the air to meet him, staff against halberd at the
      centre of the picture; Zhu Bajie swings his rake (exactly nine long iron teeth in one row) up at the Roc from the
      left; Sha Wujing thrusts his demon-quelling staff (a plain straight staff, no blade or spade) from the right; and behind them the
      White Dragon Horse rears up to shield Tang Sanzang, who sits on his back clutching his
      prayer beads. Wind from the Roc's wings tears at their robes and flattens the grass.

  # Bosses: an entrance and a defeat for each, from the novel's telling.
  - id: tiger-entrance
    stage: 8
    frame: entrance
    cast: [斑斓虎, 孙悟空, 唐僧]
    text: >-
      Chapter 14, just after Sun Wukong is freed. On the grassy slopes below Two Boundary
      Mountain, a huge striped tiger bursts out of the long grass with a roar that bends the
      stalks flat, leaping at the pilgrims from the right with its claws spread and teeth bared.
      Tang Sanzang, on foot on the path, falls back in terror with his prayer beads clutched to
      his chest. Sun Wukong steps calmly in front of him, grinning, and plucks a tiny needle
      from his ear that grows in his hand into the black iron Gold-Banded Staff. He has only
      just come out from under the mountain: no gold band on his head yet, no monk's tunic and
      no tiger-skin kilt, only a ragged loincloth of old cloth, with moss and grass still caught
      in his fur.
  - id: tiger-defeat
    stage: 8
    cast: [孙悟空, 斑斓虎, 唐僧]
    text: >-
      Chapter 14, below Two Boundary Mountain. Sun Wukong brings the Gold-Banded Staff down in
      one tremendous blow on the striped tiger's head as it springs at him, and the great beast
      crumples to the grass, stunned and lifeless, its eyes shut, its striped body sprawled
      whole and unmarked. Grass and dust fly up in a ring from the blow. Wukong, who has only
      just been freed, still wears no gold band, no tunic and no kilt, only a ragged loincloth
      of old cloth; the tiger's striped skin is about to become his kilt, and he already eyes it
      with a satisfied grin. Behind him Tang Sanzang stares open-mouthed at the strength of his
      new disciple. No blood.
  - id: baigu-entrance
    stage: 20
    frame: entrance
    cast: [白骨精, 唐僧, 猪八戒, 沙悟净, 白龙马]
    text: >-
      Chapter 27. High on White Tiger Ridge, Sun Wukong has flown off to beg alms and the
      pilgrims rest among the rocks: Tang Sanzang sits on a boulder with his prayer beads,
      Zhu Bajie dozes against his rake, Sha Wujing guards the luggage pole, and the White
      Dragon Horse grazes. Above them, riding a cold, grey wind cloud, the White Bone Demon looks
      down at the monk with hungry delight. Her true shape, a tall skeleton of pale bone, shows
      faintly through the mist as she descends, already gathering into her disguise: a lovely
      young village woman in a plain Tang wrap skirt with a basket of food on her arm, her
      shadow on the ground beneath the cloud still a skeleton.
  - id: baigu-defeat
    stage: 20
    cast: [孙悟空, 白骨精, 唐僧, 猪八戒]
    text: >-
      Chapter 27, the third blow on White Tiger Ridge. The White Bone Demon comes back a third
      time disguised as a white-haired old man leaning on a staff. Sun Wukong first calls the
      mountain god and the local earth god to watch from the clouds, two small old gods in
      plain robes, so she cannot slip away again; then he swings the Gold-Banded Staff
      down on her with both hands. Her demon spirit is snuffed out, and where the old man stood
      the disguise falls away into a clean heap of white bones, a whole pale skeleton lying on
      the path in a wisp of fading grey mist. Tang Sanzang, on the left, recoils in horror,
      and Zhu Bajie, beside him, whispers that Wukong has killed an innocent man. No blood, and
      no writing on the bones.
  - id: goldhorn-entrance
    stage: 24
    frame: entrance
    cast: [金角大王, 银角大王, 唐僧, 孙悟空, 猪八戒, 沙悟净, 白龙马]
    text: >-
      Chapter 32, Flat-Top Mountain. On a high crag at the mouth of Lotus Flower Cave, the two
      demon kings stand side by side looking down the mountain: the Gold Horn King, the elder,
      with his seven-star sword, and the Silver Horn King, sly and smiling, with the purple-gold
      red gourd in his hand and the jade vase and golden rope at his belt. Far below on the
      winding road, small but clear, the pilgrims come on unsuspecting: Tang Sanzang on the White
      Dragon Horse, Sun Wukong with his staff, Zhu Bajie with his rake and Sha Wujing with the
      luggage pole. Behind the two kings little demons with plain banners and spears crowd the
      dark, rough cave opening in the cliff, which has no gate, archway, plaque or signboard.
  - id: goldhorn-defeat
    stage: 25
    frame: story
    cast: [太上老君, 金角大王, 银角大王, 孙悟空]
    text: >-
      Chapter 35, outside Lotus Flower Cave. The two demon kings have been caught in their own
      treasures, the Silver Horn King in the purple-gold red gourd and the Gold Horn King in the
      jade vase. Now Laozi descends on a cloud to claim his runaway furnace boys. He holds up
      the gourd and the vase and unstops them; from each a stream of immortal breath pours out,
      and in the light the two demon kings, horns and all, are turning back into two small
      Daoist boy attendants in plain robes, kneeling on the cloud before their master, one still
      faintly gold and one faintly silver. Sun Wukong stands on the rocks below with his staff
      grounded, half bowing, half grumbling that Laozi let his own servants loose on the road.
  - id: redboy-entrance
    stage: 28
    frame: entrance
    cast: [红孩儿, 唐僧, 孙悟空, 白龙马]
    text: >-
      Chapter 40, among the burning peaks of Mount Hao. A red cloud hangs over the road. High
      in a pine tree by the path, Red Boy has disguised himself as a lost child of seven and
      hung himself up bound hand and foot with hemp rope, crying for help, in his red
      embroidered belly-cloth and trousers. Tang Sanzang, on the White Dragon Horse below, looks
      up with pity and tells his disciples to cut the boy down. Sun Wukong, beside the horse,
      narrows his fiery golden eyes, sees through the trick, and grips his staff; the boy's
      face, turned to the monk, is pitiful, but the eyes he turns on Wukong burn with fire.
  - id: redboy-defeat
    stage: 31
    frame: story
    cast: [观音菩萨, 红孩儿, 孙悟空]
    text: >-
      Chapter 42. Guanyin has borrowed thirty-six heavenly blades from the Heavenly King and
      turned them into a thousand-petalled lotus seat, and Red Boy, mocking, has sat on it.
      Now, in the air before the Fire Cloud Cave, the lotus petals have turned back into a ring
      of straight, gleaming sword-points that close around him like a cage, holding him fast
      without a wound. Guanyin, on a cloud above with her willow and jade vase, recites the
      spell, and five golden rings she has thrown, one on his head, one on each wrist and one on
      each ankle, tighten so that he is forced to his knees with his palms pressed together,
      tamed. His fire-tipped spear lies dropped beside him. Sun Wukong watches from a cloud with
      his staff, delighted. No blood.
  - id: bull-entrance
    stage: 52
    frame: entrance
    cast: [牛魔王, 孙悟空]
    place: >-
      Thunder Accumulation Mountain (积雷山), near the Flaming Mountain: dark rocky peaks above
      a forest of pines, the Cloud-Touching Cave (摩云洞) set in the cliff, a red glow of the
      Flaming Mountain on the horizon.
    text: >-
      Chapter 60. Sun Wukong has come to Cloud-Touching Cave to ask his old sworn brother for
      help. The Bull Demon King strides out of the cave mouth to meet him, huge and roaring with
      anger at the monkey who tormented his son, his black bull's head lowered and his great
      curved horns forward, black iron armour gleaming, dark robe swirling, the mixed-iron cudgel
      swung up in his fist: a long, thin, plain straight iron rod of even thickness from end
      to end, longer than he is tall, not a club or mace. Little demons scatter out of his way. Sun Wukong stands on the rocks
      before him, staff held loosely across his shoulders, bowing half in mockery to his elder
      brother.
  - id: bull-defeat
    stage: 52
    cast: [牛魔王, 孙悟空, 猪八戒]
    text: >-
      Chapter 61, above the Flaming Mountain. Hemmed in by Heaven's armies, the Bull Demon King
      has turned into his true form, a vast white bull, bigger than a hall, with great curved
      horns. Prince Nezha, a young god-boy in red silk and a cinnabar sash, has hung his
      blazing fire wheel on the bull's horns so that the flames hold him fast, and he is
      threading a rope through the bull's nose to lead him; above them Heavenly King Li, a god
      in golden armour, holds up his demon-revealing mirror so the bull can change shape no
      more. The bull bellows and gives in, kneeling. Sun Wukong with his staff and Zhu Bajie
      with his rake close in on either side. No blood.
  - id: spider-entrance
    stage: 59
    frame: entrance
    cast: [蜘蛛精, 唐僧]
    text: >-
      Chapter 72. Tang Sanzang has insisted on begging alms himself for once, and comes alone
      across a little stone bridge to a quiet thatched farmhouse among trees. In its garden the
      seven Spider Spirits, beautiful women in pale silk robes, fully clothed, are at their
      leisure: some sit embroidering at a window, others kick a leather ball high between them
      in the sunlight. The monk stops at the bridge, hesitating, hands together. The sisters
      turn and smile at him all at once. Look closer and fine threads of shining silk run from
      the eaves to the trees, glinting like dew.
  - id: spider-defeat
    stage: 59
    cast: [孙悟空, 蜘蛛精]
    text: >-
      Chapter 73. The seven sisters have spun a vast canopy of shining silk over the trees and
      the temple roofs. Sun Wukong has plucked a tuft of his hair and blown it into seventy
      little monkeys, each with a forked pole, who wind the silk up like thread on a spindle and
      haul the seven spiders, in their true form as spiders as big as a man, out of their webs.
      The spiders dangle helpless on their own threads, and Wukong leaps up among the gleaming
      strands to bring the Gold-Banded Staff down on them, scattering them broken from the
      web. No blood or gore.
  - id: roc-entrance
    stage: 61
    frame: entrance
    cast: [金翅大鹏, 孙悟空]
    text: >-
      Chapter 74-75. On the great ridge of Lion-Camel Mountain, under a dark sky, the three
      demon kings ride out at the head of their horde of demons. In the centre, towering over
      the rest, is the Golden-Winged Roc, his vast golden wings half open, his long painted
      halberd raised; beside him are the Azure Lion, a huge lion-headed demon with a blue-green
      mane, and the Yellow-Tusked Elephant, a white elephant demon with a long trunk, smaller
      and further back. Banners and spears fill the valley behind them. On a crag in the
      foreground, small and alone, Sun Wukong crouches with his staff, spying on them.
  - id: roc-defeat
    stage: 64
    frame: story
    cast: [如来佛祖, 金翅大鹏, 孙悟空]
    place: >-
      The sky above Lion-Camel Ridge: grim dark peaks and the demon city far below, the
      clouds above them broken open by golden light from the Buddha.
    text: >-
      Chapter 77. The Buddha has come from Vulture Peak on clouds of golden light, seated on his
      lotus, to take the Golden-Winged Roc himself. The Roc, his vast wings shining bright gold
      from root to tip, swoops at him with talons spread
      and halberd raised, and the Buddha calmly lifts one finger: the Roc's wings lock in the
      air, so he can fly no further and hangs there, stilled, above the Buddha's halo, about to
      become a guardian of his throne. Sun Wukong, small on a cloud to one side, bows with his
      staff tucked under his arm. Awe, not violence.
  - id: buddha-entrance
    stage: 79
    frame: story
    cast: [如来佛祖, 唐僧, 孙悟空, 猪八戒, 沙悟净, 白龙马]
    place: >-
      The Great Hero Treasure Hall of Thunderclap Monastery on Vulture Peak (灵山雷音寺): a vast
      hall of red columns and golden light open to the clouds, rows of buddhas, bodhisattvas and
      arhats seated in tiers, flowers drifting down through the air.
    text: >-
      Chapter 98, the end of the road. The Buddha sits enthroned on his great lotus at the head
      of the hall, serene and enormous, robed in gold, in a vast halo of soft light, attended
      on both sides by buddhas, bodhisattvas and arhats. Before him the pilgrims have arrived
      after fourteen years: Tang Sanzang in his crimson kasaya and the Vairocana crown kneels
      and bows to the floor with palms together, and behind him Sun Wukong, Zhu Bajie and Sha
      Wujing kneel in a row, their weapons set down, with the White Dragon Horse bowing his
      head. Painted with reverence: a trial of the spirit, not a battle.
  - id: buddha-ending
    stage: 79
    frame: story
    cast: [如来佛祖, 唐僧, 孙悟空, 猪八戒, 沙悟净, 白龙马]
    place: >-
      The courtyard of Thunderclap Monastery on Vulture Peak (灵山雷音寺), before the treasure
      halls, among clouds and blossoming trees, golden light from the hall behind.
    text: >-
      Chapter 98, the scriptures given. At the Buddha's command his two disciples Ananda, a
      young monk, and Kasyapa, an old monk, carry out the true scriptures: bundles of rolled
      scrolls wrapped in yellow silk, shown only as closed rolls, with no writing visible. Tang
      Sanzang receives the first bundle in both arms with his head bowed and tears of joy; Sha
      Wujing and Zhu Bajie load bundles onto the White Dragon Horse, who stands proud and
      still; Sun Wukong grins and lifts a bundle onto his shoulder. High above them, at the top
      of the picture, the Buddha on his lotus throne looks down in blessing in a halo of light.
      Peace and fulfilment.

  # Demon entrances: each demon of the bestiary at the stage they are first
  # met. Those a boss entrance shows are left out: the Silver Horn King is in
  # goldhorn-entrance.
  - id: havoc-appears
    stage: 1
    frame: entrance
    cast: [混世魔王, 孙悟空]
    place: >-
      Kanyuan Mountain (坎源山), north of Flower-Fruit Mountain in the Eastern Continent: dark,
      jagged crags above a gorge, the Water-Belly Cave a rough black opening in the rock with
      no sign, plaque or carving of any kind. This is a memory from before the pilgrimage.
    text: >-
      Chapter 2. Sun Wukong, just home from learning the Way under the Patriarch Subhuti, has
      flown to the Water-Belly Cave to punish the demon who carried off his monkeys. The Havoc
      Demon King comes striding out of the cave mouth in his black-gold helmet, black silk robe
      and black iron armour, gripping his huge broad blade, laughing at how small the monkey is,
      a crowd of minor demons with clubs pushing out behind him. Sun Wukong stands bare-handed
      on the rocks before him, fists up, eyes blazing. At this point he has no staff yet, no
      gold band, no monk's tunic and no tiger-skin kilt: only a plain red cloth robe tied with
      a sash, taken from the human world.
  - id: bear-appears
    stage: 11
    frame: entrance
    cast: [黑熊精, 孙悟空]
    place: >-
      The Guanyin Chan Temple (观音禅院) below Black Wind Mountain at night: Tang halls of red
      columns and grey tiles, the meditation halls burning, smoke and sparks against a dark sky
      and the black forested mountain behind.
    text: >-
      Chapter 16. The greedy abbot has set the temple on fire to steal Tang Sanzang's kasaya,
      and the blaze lights up the night. Drawn by the glow, the Black Bear Demon has come down
      from Black Wind Mountain on a gust of black wind, and now he rises over the burning
      roofs clutching the kasaya, its crimson patchwork panels and gold edging shining in the
      firelight, his black-tasselled spear in his other hand and his small eyes gleaming with
      greed. Far off on the roof of the monk's chamber, small, Sun Wukong stands guard with his
      staff over his sleeping master, his back turned, not yet seeing the theft.
  - id: yellowwind-appears
    stage: 13
    frame: entrance
    cast: [黄风怪, 孙悟空]
    text: >-
      Chapter 21, at Yellow Wind Cave on Yellow Wind Ridge. The Yellow Wind Demon, his golden
      helmet plumes streaming and his steel trident held aside, turns toward the southeast,
      opens his marten's mouth wide and blows the Samadhi wind: a roaring yellow storm of sand
      and grit that boils across the ridge, uproots bushes and darkens the sky. It strikes Sun
      Wukong full in the face; he staggers back with one arm thrown over his stinging,
      streaming eyes, the Gold-Banded Staff still in his other hand, his clothes torn at by the
      wind.
  - id: yellowrobe-appears
    stage: 21
    frame: entrance
    cast: [黄袍怪, 唐僧]
    place: >-
      Inside the Bowl-Moon Cave (波月洞) on Bowl Mountain beyond the Black Pine Forest: a great
      cavern with stone halls, smooth flagstones and pale light falling through an opening above.
    text: >-
      Chapter 28. Lost without Sun Wukong, Tang Sanzang has wandered alone into the Bowl-Moon
      Cave and come upon its master asleep on a smooth stone couch. The Yellow Robe Demon has just
      woken: he rears up on the couch, his indigo-blue face, white tusks and great mouth turned
      on the intruder, his rouge-red side whiskers bristling, his star-bright eyes wide, his pale
      yellow robe falling from his shoulders, one blue foot planted on the floor and his
      gleaming steel scimitar in hand. Tang Sanzang, small and trembling at the cave mouth,
      sinks to his knees with his prayer beads.
  - id: goldfish-appears
    stage: 39
    frame: entrance
    cast: [金鱼精]
    place: >-
      The shrine of the Great King of Spiritual Touch at Chen Village beside the River of Heaven
      (通天河), at night: a lamp-lit Tang temple hall of red columns, an offering table laid
      with food, and through the open doors the wide dark river under the moon.
    text: >-
      Chapter 47. The village must give the Great King a boy and a girl to eat each year. Now
      he comes for them on a howling gust of cold wind off the river that sets the lamps
      guttering: the Great King of Spiritual Touch sweeps through the shrine doors in his
      shining golden helmet and armour, his round fish eyes bulging, his golden whiskers stiff,
      water-weed in his teeth and the nine-petalled bronze hammer in his hand. On the offering
      table sit the two children, a little boy and a little girl in festive red clothes, but
      they are Sun Wukong and Zhu Bajie in disguise: the boy's eyes glint fiery gold, and the
      girl is suspiciously stout.
  - id: greenbull-appears
    stage: 42
    frame: entrance
    cast: [青牛精, 孙悟空]
    text: >-
      Chapter 50, before Golden Helmet Cave on Golden Helmet Mountain. The Single-Horned
      Rhinoceros King has come out to fight Sun Wukong, his indigo hide gleaming and his steel
      spear set aside, and now he throws the Diamond Snare. The plain white-steel ring spins in
      the air between them, glowing cold white, and with a great rushing sound it sucks the
      Gold-Banded Staff straight out of Wukong's hands; the staff streaks toward the ring like
      a comet. Wukong, his hands suddenly empty, leaps back in astonishment, and the demon throws
      back his one-horned head and laughs.
  - id: scorpion-appears
    stage: 47
    frame: entrance
    cast: [蝎子精, 孙悟空, 猪八戒]
    place: >-
      Before the Demoness's cave on Poison Foe Mountain: a narrow, flower-grown ravine between
      sheer stone walls, two rough slabs of rock framing a dark cave mouth, with no sign,
      plaque, carving or lettering anywhere.
    text: >-
      Chapter 55. Sun Wukong and Zhu Bajie fight the Scorpion Demoness, who has carried off
      their master. She parries Wukong's staff and Bajie's rake with her three-pronged steel fork,
      and then, spinning round with a leap, she drives her great scorpion's tail over her
      shoulder and stabs its hooked stinger down at the crown of Wukong's head. Wukong reels
      away clutching his head in agony, shouting with pain, his staff swinging wide; Bajie,
      startled, backs off with his rake raised. No blood.
  - id: macaque-appears
    stage: 49
    frame: entrance
    cast: [六耳猕猴, 唐僧, 猪八戒, 沙悟净, 白龙马]
    text: >-
      Chapter 57. Tang Sanzang has banished Sun Wukong, and sits thirsty by the road. A Sun
      Wukong who is not Sun Wukong comes and kneels before him holding up a porcelain cup of
      water; when the monk refuses him, the false monkey springs to his feet with an ugly face
      and swings the iron staff at his master. In the moment of the picture the Six-Eared
      Macaque stands over Tang Sanzang, the staff raised high, his smile cold, the cup
      shattering on the stones; Tang Sanzang throws up his hands as he falls back against a
      rock. Far off down the road, small, Zhu Bajie and Sha Wujing run back, too late, and the
      White Dragon Horse rears. No blood.
  - id: ironfan-appears
    stage: 51
    frame: entrance
    cast: [铁扇公主, 孙悟空]
    text: >-
      Chapter 59, at Palm-Leaf Cave on Emerald Cloud Mountain. Sun Wukong has come to borrow
      the plantain fan, and Princess Iron Fan, furious at the monkey who took her son from her,
      has hacked at his head with her blue-steel swords to no effect. Now she draws out the
      great plantain fan and swings it at him once: a hurricane bursts from the leaf and hurls
      Sun Wukong head over heels into the sky, a small spinning figure tumbling away among
      torn leaves and cloud, his staff flailing. She stands on the green cliff before her cave,
      robes and kerchief whipping in the gale, the swords at her side.
  - id: ninehead-appears
    stage: 54
    frame: entrance
    cast: [九头虫, 孙悟空, 猪八戒]
    place: >-
      The Jade-Waves Pond (碧波潭) under Scattered Rock Mountain (乱石山): a deep green lake in a
      ring of broken crags, spray flying from the water.
    text: >-
      Chapter 62. Fighting Sun Wukong and Zhu Bajie above the Jade-Waves Pond, the Nine-Headed
      Prince Consort throws off his silver armour and shows his true form: a monstrous bird with
      wide brocade-feathered wings and nine heads on long necks. As Bajie swings his rake, one
      of the heads darts out from under the bird's wing and snaps him up by the bristles of
      his neck, lifting him kicking into the air; Sun Wukong, on the cliff, whirls his staff
      and leaps after them. The other eight heads turn on him, hooked beaks open. No blood.
  - id: deer-appears
    stage: 56
    frame: entrance
    cast: [白鹿精, 唐僧]
    place: >-
      The throne hall of the palace of Bhikkhu (比丘国): a long Tang hall of red columns and
      gilded beams, courtiers in round-collared robes and futou caps lining the floor, a pale and
      sickly king on the throne.
    text: >-
      Chapter 78. While the king of Bhikkhu receives Tang Sanzang, the State Preceptor arrives.
      The old Daoist walks up the middle of the throne hall leaning on his dragon-carved vine
      staff, his crane-feather cloak trailing, and does not bow; the sick king rises from his
      throne to greet him, and every courtier bends low. Tang Sanzang, standing to one side in
      his crimson kasaya, bows politely, and the Preceptor looks down his long deer-like face
      at the monk with cold, appraising eyes. Behind the Preceptor, faint as a shadow on the
      floor, the shadow of a deer's branching antlers.
  - id: yellowbrow-appears
    stage: 66
    frame: entrance
    cast: [黄眉怪, 孙悟空, 唐僧, 猪八戒, 沙悟净]
    place: >-
      The Lesser Thunderclap Monastery (小雷音寺): a false copy of the Buddha's own monastery, a
      great Tang hall glowing with gold, with rows of false buddhas and arhats who are demons in
      disguise.
    text: >-
      Chapter 65. Tang Sanzang, Zhu Bajie and Sha Wujing kneel and bow to the false Buddha on
      the lotus throne; only Sun Wukong stands, staff raised, shouting that it is a trick. The
      false Buddha throws off the disguise and is the Yellow-Browed King, his bushy yellow
      eyebrows standing on end, and he flings up his golden cymbals: the two huge golden discs
      clap shut in the air over Wukong with a blinding flash, closing on him like a clam. The
      other pilgrims look up in horror.
  - id: rat-appears
    stage: 67
    frame: entrance
    cast: [白毛鼠精, 唐僧, 孙悟空]
    place: >-
      A dark pine forest on the road west: tall black pines, deep shade, shafts of pale light.
    text: >-
      Chapter 80. Deep in the pine forest a lovely young woman is tied to a tree with kudzu
      vines, her robes in disarray but decent, the lower part of her hidden in a mound of earth
      at the foot of the trunk, weeping and begging the passing monk to save her. Tang Sanzang
      halts beside her full of pity, one hand reaching out. Sun Wukong, at his elbow, scowls at
      her with his fiery golden eyes and tugs him away, for he sees what she is: in the gloom
      behind her, the shadow on the tree trunk is a rat's.
  - id: rabbit-appears
    stage: 76
    frame: entrance
    cast: [玉兔精, 唐僧]
    place: >-
      A broad street in the capital of Tianzhu (天竺国), an Indian kingdom: a crowd of townsfolk,
      and above them a tall, painted wooden pavilion hung with silk streamers, flowers and
      bells, built for the princess to choose her husband.
    text: >-
      Chapter 93. On the top of the decorated pavilion the false princess, the Jade Rabbit in
      disguise, has seen the holy monk from afar and throws her embroidered silk ball straight
      down at him: it strikes Tang Sanzang on the head and knocks his hat askew, and the crowd
      cheers that he is the chosen husband. The princess leans over the rail in her moon-white
      and rose robes, smiling triumphantly, her rabbit-eared tufts of hair lifting in the
      breeze. Tang Sanzang stands below in his crimson kasaya, stunned, the ball bouncing from
      his shoulder.

  # The party gathers.
  - id: wukong-freed
    stage: 8
    frame: story
    cast: [孙悟空, 唐僧]
    place: >-
      Five Elements Mountain at Two Boundary Mountain (两界山): a great rocky mountain of five
      peaks on the frontier of the Tang lands, pines on its slopes.
    text: >-
      Chapter 14. Tang Sanzang has climbed to the summit and peeled away the Buddha's golden seal,
      a strip of gold paper shown blank, and now Five Elements Mountain splits open with a crack
      like thunder. Rocks fly and dust rolls down the slopes as Sun Wukong bursts free from the
      stone where he has been pinned for five hundred years, leaping out in a flash of golden
      light, moss and grass still caught in his fur, arms flung wide in joy, toward Tang
      Sanzang, his new master, who steps back amazed at the foot of the mountain with his prayer
      beads. Sun Wukong appears only once in the picture, in mid-leap. No horse. He has no staff in hand, no gold band, no
      monk's tunic and no tiger-skin kilt yet, only a ragged loincloth of old cloth.
  - id: horse-transformed
    stage: 9
    frame: story
    cast: [白龙马, 观音菩萨, 孙悟空, 唐僧]
    place: >-
      Eagle Grief Stream (鹰愁涧) on Coiled Serpent Mountain: a deep, narrow gorge of sheer rock
      with a cold, clear torrent rushing between the cliffs, spray hanging in the air.
    text: >-
      Chapter 15. The young dragon prince who ate Tang Sanzang's horse rises from the rapids of
      Eagle Grief Stream as Guanyin descends on a cloud above the gorge. She has taken the
      bright pearl from under his chin, and now she sprinkles sweet dew on him from the willow
      sprig in her jade vase and tells him to change: in a swirl of silver water and light the
      long white dragon is turning into a white horse, his front half already a horse with a
      silver-white mane, his back half still a dragon's coiling scaled tail. On the bank Sun
      Wukong reaches for the horse's bridle, and Tang Sanzang bows with palms together to the
      Bodhisattva.
  - id: pigsy-joins
    stage: 12
    frame: story
    cast: [猪八戒, 唐僧, 孙悟空]
    place: >-
      Gao Village (高老庄) in the land of Qoco: the courtyard of a prosperous Tang farmhouse with
      a tiled gatehouse, whitewashed walls, threshing ground and fields beyond.
    text: >-
      Chapter 19. Having learned that the monkey he fought serves the very pilgrim Guanyin
      told him to wait for, Zhu Bajie kneels in the farmhouse courtyard before Tang Sanzang and
      bows his huge pig's head to the ground, his nine-toothed rake laid on the flagstones at his
      side, while the monk lays a kind hand on his shoulder and gives him his new name. Sun
      Wukong leans on his staff beside them with a smug, cocky grin. Old Master Gao and his
      household peep out of the doors in relief.
  - id: sandy-joins
    stage: 16
    frame: story
    cast: [沙悟净, 唐僧, 孙悟空, 猪八戒, 白龙马]
    text: >-
      Chapter 22, at the Flowing Sand River, eight hundred li of heavy, yellow-grey water where
      even a goose feather sinks. Guanyin's disciple Moksa, a young warrior monk on a cloud,
      holds up the red gourd she gave him and calls the river ogre by his Buddhist name, and Sha Wujing rises
      out of the swirling water, solemn and dripping, and wades to the bank to kneel before Tang
      Sanzang, the necklace of nine small skulls in his hands, ready to be bound with the gourd
      into a raft. Tang Sanzang, on the bank, lifts his hands in welcome; Sun Wukong, Zhu Bajie
      and the White Dragon Horse watch from beside him.
  - id: party-sets-off
    stage: 17
    frame: story
    cast: [唐僧, 孙悟空, 猪八戒, 沙悟净, 白龙马]
    place: >-
      The road west beyond the Flowing Sand River: open, rolling country of grass and scattered
      trees under a bright morning sky, the road winding far away to blue mountains.
    text: >-
      Chapter 22-23. The four pilgrims and the horse set out together for the first time, seen
      from the side as they walk west along the road at sunrise. Sun Wukong leads the way with
      the Gold-Banded Staff on his shoulder, looking back over it with a grin; Tang Sanzang rides
      the White Dragon Horse with his prayer beads in hand and the nine-ringed staff beside him;
      Zhu Bajie trudges after with his rake over his shoulder; Sha Wujing brings up the rear
      with the luggage on his shoulder pole. Long morning shadows, a fresh wind, the whole road
      ahead.

  # Battle moves: one character alone in a clear pose, for the battle screen.
  - id: wukong-strike
    stage: 8
    frame: move
    cast: [孙悟空]
    place: &moveground >-
      A simple painted backdrop: pale sky with a few soft clouds over a low grassy ridge and
      faint blue mountains, nothing else.
    text: >-
      Sun Wukong strikes: he leaps high into the air with both hands on the Gold-Banded Staff,
      swinging it over his head in a huge arc to bring it crashing down, body twisted for the
      blow, fur and tunic streaming, a sweeping golden arc of light trailing the staff.
  - id: wukong-hit
    stage: 8
    frame: move
    cast: [孙悟空]
    place: *moveground
    text: >-
      Sun Wukong is hit: knocked backward by a blow, he skids across the ground on his heels,
      the Gold-Banded Staff held crosswise before him to guard, teeth gritted, one eye
      squeezed shut, dust spraying from his feet. Stung, not hurt.
  - id: wukong-victory
    stage: 8
    frame: move
    cast: [孙悟空]
    place: *moveground
    text: >-
      Sun Wukong in victory: perched on a rock with one foot up, the Gold-Banded Staff planted
      upright beside him, one hand shading his fiery golden eyes as he looks far off, grinning
      cockily, his tiger-skin kilt stirring in the wind.
  - id: horse-strike
    stage: 9
    frame: move
    cast: [白龙马]
    place: *moveground
    text: >-
      The White Dragon Horse charges: at full gallop with no rider, head low and ears back,
      his silver-white mane and tail streaming like a dragon's, hooves throwing up turf, a
      faint pearly shimmer along his scales.
  - id: horse-hit
    stage: 9
    frame: move
    cast: [白龙马]
    place: *moveground
    text: >-
      The White Dragon Horse is hit: he rears up high on his hind legs with no rider, neighing,
      forelegs pawing the air, mane flying, eyes wide, the saddle and bridle shaken.
  - id: horse-victory
    stage: 9
    frame: move
    cast: [白龙马]
    place: *moveground
    text: >-
      The White Dragon Horse in victory: standing proud with no rider, head high and neck
      arched, one foreleg lifted, mane and tail flowing in the wind, sunlight on his pearly
      scales and pale-gold horn buds, a prince's calm gaze.
  - id: bajie-strike
    stage: 12
    frame: move
    cast: [猪八戒]
    place: *moveground
    text: >-
      Zhu Bajie strikes: he heaves the nine-toothed rake up over his head in both hands and
      brings it down in a great chopping blow, big ears flapping, belly bouncing, mouth open in a
      bellow, robe sleeves rolled up, a heavy arc following the nine iron teeth. One rake only,
      shown once; his whole body from head to feet inside the picture.
  - id: bajie-hit
    stage: 12
    frame: move
    cast: [猪八戒]
    place: *moveground
    text: >-
      Zhu Bajie is hit: knocked down onto his broad rump in the dust, legs in the air, the rake
      held up crosswise to fend off the next blow, his big ears flung back and his face a
      picture of comic dismay.
  - id: bajie-victory
    stage: 12
    frame: move
    cast: [猪八戒]
    place: *moveground
    text: >-
      Zhu Bajie in victory: rake slung over his shoulder, one hand patting his round belly, chin
      up and chest puffed out like the old Marshal he was, a sly, self-satisfied grin.
  - id: sandy-strike
    stage: 16
    frame: move
    cast: [沙悟净]
    place: *moveground
    text: >-
      Sha Wujing strikes: a long, low lunge, driving the demon-quelling staff straight forward
      in both hands, his red hair and beard flying, round eyes fixed on the foe, robe snapping
      behind him, a straight streak of pale light along the staff.
  - id: sandy-hit
    stage: 16
    frame: move
    cast: [沙悟净]
    place: *moveground
    text: >-
      Sha Wujing is hit: braced against a blow, he slides back a step on planted feet with the
      demon-quelling staff held crosswise to block, knees bent, jaw set, the skull necklace
      swinging, dust kicked up behind him. Unbowed.
  - id: sandy-victory
    stage: 16
    frame: move
    cast: [沙悟净]
    place: *moveground
    text: >-
      Sha Wujing in victory: standing tall and still, the demon-quelling staff planted upright
      in one hand, the other hand raised before his chest in a monk's salute, his solemn blue
      face calm, a quiet nod.
  - id: tang-strike
    stage: 8
    frame: move
    cast: [唐僧]
    place: *moveground
    text: >-
      Tang Sanzang prays, for he never fights: he stands with eyes closed and head bowed,
      telling his wooden prayer beads between palms pressed together, lips moving in a sutra, the
      nine-ringed staff leaning in the crook of his arm, a soft golden glow rising around him.
  - id: tang-hit
    stage: 8
    frame: move
    cast: [唐僧]
    place: *moveground
    text: >-
      Tang Sanzang is startled: he flinches back with his hands raised, eyes wide and mouth open,
      his kasaya swinging and the rings of his staff jangling as it tilts, prayer beads
      swinging from one hand. Frightened, not harmed.
  - id: tang-victory
    stage: 8
    frame: move
    cast: [唐僧]
    place: *moveground
    text: >-
      Tang Sanzang is joyful: he smiles warmly with eyes bright, palms together before his
      chest with the prayer beads, the nine-ringed staff upright beside him, his crimson and
      gold kasaya glowing in clear sunlight.
